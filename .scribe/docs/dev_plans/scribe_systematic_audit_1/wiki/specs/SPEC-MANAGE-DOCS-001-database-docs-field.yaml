## Problem Statement

**BUG-MANAGE-DOCS-001:** 80%+ of manage_docs actions fail with DOC_NOT_FOUND errors because the scribe_projects database table is missing the `docs_json` column. Document mappings exist in state.json but are not retrieved during database-first project resolution.

**Impact:**
- 10+ document editing actions completely non-functional (replace_section, apply_patch, list_sections, etc)
- Wiki maintenance operations blocked
- Phase 5.5 deliverables cannot be completed without workaround

**Root Cause Chain:**
1. Database schema incomplete: scribe_projects table has only 16 columns, missing `docs_json`
2. Query returns partial data: `shared/logging_utils.py:111-119` SELECT only 3 fields
3. No fallback merge: session_project dict has {name, root, progress_log} but NO docs
4. Validation fails: manage_docs checks `project.get("docs")` → None → DOC_NOT_FOUND

---

## Goals

1. ✅ **Add docs_json column** to scribe_projects table
2. ✅ **Backfill existing projects** with data from state.json
3. ✅ **Update set_project tool** to populate docs_json on INSERT/UPDATE
4. ✅ **Update project resolution query** to SELECT and parse docs_json
5. ✅ **Verify all manage_docs actions** work after fix

---

## Non-Goals

- ❌ Full state.json deprecation (future work)
- ❌ Schema versioning system (future work)
