## Open Questions

1. **Should all tools support verbosity flag?**
   - Recommendation: Only tools with context-heavy readable output
   - Examples: get_project, read_recent (if showing extra context)

2. **What's acceptable token overhead for formatting?**
   - Recommendation: Up to 20% overhead acceptable for UX (boxes, colors)
   - Example: rotate_log readable may be slightly larger due to formatting

3. **Should verbose default to true or false?**
   - Recommendation: Default to false (token optimization)
   - Users can opt-in when they want extra context

