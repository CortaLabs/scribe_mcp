```python
async def record_reminder_shown(
    pool: asyncpg.Pool,
    session_id: str,
    reminder_hash: str,
    tool_name: str,
    project_root: Optional[str] = None,
    agent_id: Optional[str] = None,
    reminder_key: Optional[str] = None,
    operation_status: str = "neutral",
    context_metadata: Optional[Dict[str, Any]] = None
) -> None:
    """Record that a reminder was shown."""
    async with pool.acquire() as conn:
        await conn.execute("""
            INSERT INTO reminder_history
            (session_id, reminder_hash, project_root, agent_id, tool_name,
             reminder_key, operation_status, context_metadata)
            VALUES ($1, $2, $3, $4, $5, $6, $7, $8)
        """, session_id, reminder_hash, project_root, agent_id, tool_name,
        reminder_key, operation_status, context_metadata)

async def check_reminder_cooldown(
    pool: asyncpg.Pool,
    session_id: str,
    reminder_hash: str,
    cooldown_minutes: int = 60
) -> bool:
    """Check if reminder is in cooldown period."""
    async with pool.acquire() as conn:
        result = await conn.fetchrow("""
            SELECT shown_at FROM reminder_history
            WHERE session_id = $1 AND reminder_hash = $2
            ORDER BY shown_at DESC LIMIT 1
        """, session_id, reminder_hash)

        if not result:
            return False  # Not in cooldown

        import datetime
        cutoff = datetime.datetime.utcnow() - datetime.timedelta(minutes=cooldown_minutes)
        return result['shown_at'] > cutoff
```

**Estimated Effort**: 12-16 hours

