        - gpt-5.3-codex-spark
        - gpt-5.2-codex
        - gpt-5.2-codex-mini
        - gpt-5.1-codex
        - gpt-5.1-codex-mini
        - gpt-5-codex
        - gpt-5-codex-mini
        sandbox_mode: workspace-write
        skip_git_repo_check: true
        full_auto: false
        dangerously_bypass_approvals_and_sandbox: false
        enforce_cwd_restrictions: true
        allowed_cwd_roots: []
        strict_fork_isolation: true
        max_budget_usd: 10.0
        env: {}
      zlm:
        enabled: false
        display_name: ZLM (GLM)
        default_model: GLM-5
        fallback_model: GLM-5-Air
        models:
        - GLM-5
        - GLM-5-Air
        - GLM-5-Flash
        - GLM-5-FlashX
        - GLM-5-X
        - GLM-5-Code
        - GLM-4.7
        - GLM-4.7-Flash
        - GLM-4.5-Air
        - GLM-4.5-Flash
        - GLM-4.7-FlashX
        permission_mode: default
        setting_sources:
        - project
        max_budget_usd: 10.0
        max_turns: 100
        include_partial_messages: true
        max_thinking_tokens: null
        betas: []
        env:
          api_key_var: ZAI_API_KEY
          base_url: https://api.z.ai/api/anthropic
          timeout_ms: 3000000
    warm_pool_size: 0
    warm_pool_idle_timeout_seconds: 300
    warm_pool_check_interval_seconds: 30
    sandbox:
      enabled: true
      temp_dir_prefix: council_sandbox_
      temp_dir_base: /tmp
      permission_mode: default
      include_mcp_servers: false
      allowed_tools:
      - Read
      - Glob
      - Grep
      - WebFetch
      - WebSearch
      cleanup_on_end: true
    worktree_base_dir: .worktrees
    worktree_branch_prefix: agent/
    worktree_cleanup_on_start: true
    agents:
      max_depth: 2
      max_concurrent: 8
      recursive_spawning: true
      output_buffer_lines: 2000
      output_flush_threshold: 0.8
