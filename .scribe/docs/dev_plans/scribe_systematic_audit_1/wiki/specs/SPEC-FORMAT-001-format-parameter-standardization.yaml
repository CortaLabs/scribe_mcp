### Per-Tool Implementation

**Pattern for Tool Migration**:

```python
# BEFORE (broken compact mode)
async def list_projects(format: str = "structured", **kwargs):
    projects = await storage.get_projects()

    if format == "readable":
        return _format_readable_projects(projects)
    else:
        # BUG: Returns same JSON for both structured and compact
        return {"ok": True, "projects": projects}

# AFTER (fixed compact mode)
class ListProjectsTool(BaseFormattedTool):
    async def execute(self, format: str = "readable", **kwargs):
        projects = await storage.get_projects()
        return self.format_response(projects, format, **kwargs)

    def _format_readable(self, projects, **kwargs):
        # Existing readable logic
        return _format_readable_projects(projects)

    def _format_structured(self, projects, **kwargs):
        return {"ok": True, "projects": projects}

    # Compact mode now works via base class default implementation
```

