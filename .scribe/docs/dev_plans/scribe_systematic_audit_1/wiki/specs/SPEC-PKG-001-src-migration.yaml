---
# SPEC-PKG-001: src/ Layout Migration Specification
# Ultra-detailed implementation blueprint for migrating scribe_mcp to src/ layout

metadata:
  spec_id: SPEC-PKG-001
  title: "scribe_mcp src/ Layout Migration"
  type: package_restructure
  phase: 3
  team: C
  agent: ResearchAgent-Phase3-SrcMigration
  project: scribe_systematic_audit_1
  created: 2026-01-05
  status: draft
  dependencies:
    - team_a_syspath_analysis: complete
    - team_b_import_graph: pending
    - team_d_circular_deps: pending
  version: 1.0.0

executive_summary:
  problem_statement: |
    scribe_mcp currently uses a flat package structure at MCP_SPINE/scribe_mcp/ which requires:
    - 70 sys.path.insert() hacks (65 in tests, 5 in scripts)
    - Manual PYTHONPATH configuration for development
    - Non-standard package layout preventing pip installation
    - Import confusion between package root and MCP_SPINE root

  proposed_solution: |
    Migrate to standard src/ layout: MCP_SPINE/scribe_mcp/src/scribe_mcp/
    Benefits:
    - Eliminates ALL 65 test sys.path hacks via pip install -e .
    - Enables proper pip packaging with setup.py/pyproject.toml
    - Standardizes import patterns across codebase
    - Prevents accidental imports from uninstalled package
    - Aligns with Python packaging best practices (PEP 517/518)

  scope:
    files_affected: 208
    production_files: 111
    test_files: 97
    import_changes_estimated: 442  # From Team B (pending)

  migration_strategy: all_at_once  # Cannot be incremental
  estimated_effort:
    optimistic: 16 hours
    realistic: 24 hours
    pessimistic: 40 hours
    confidence: 0.75

  risk_level: medium_high
  rollback_complexity: high  # All-or-nothing migration

# ============================================================================
# SECTION 1: DIRECTORY STRUCTURE DESIGN
# ============================================================================

directory_structure:
  rationale: |
    Standard src/ layout separates package source from tests/docs/config.
    Benefits:
    1. Clear boundary between installed package and development files
    2. Prevents pytest from importing uninstalled code
    3. Enables editable installs (pip install -e .)
    4. Standard practice in Python ecosystem

  current_layout:
    root: MCP_SPINE/scribe_mcp/
    structure:
      - "tools/"
      - "utils/"
      - "storage/"
      - "config/"
      - "state/"
      - "db/"
      - "scripts/"
      - "plugins/"
      - "shared/"
      - "template_engine/"
      - "security/"
      - "doc_management/"
      - "templates/"
      - "demo/"
      - "tests/"
      - "server.py"
      - "__init__.py"
      - "reminders.py"
      - "debug_append_entry.py"

  proposed_layout:
    root: MCP_SPINE/scribe_mcp/
    structure:
      src:
        scribe_mcp:  # Package root moves here
          - "tools/"
          - "utils/"
          - "storage/"
          - "config/"
          - "state/"
          - "db/"
          - "plugins/"
          - "shared/"
          - "template_engine/"
          - "security/"
          - "doc_management/"
          - "templates/"
          - "server.py"  # Entry point
          - "__init__.py"
          - "reminders.py"
          - "__version__.py"  # New version file
      tests:  # Stays at root level
        - "(all 97 test files)"
      scripts:  # Stays at root level OR becomes console_scripts
        - "(9 script files)"
      demo:  # Stays at root level (not installed)
        - "demo_global_scribe.py"
      root_level_files:  # Root level files
        - "pyproject.toml"  # New
        - "setup.py"  # New
        - "MANIFEST.in"  # New
        - "README.md"
        - "requirements.txt"
        - ".scribe/"  # Unchanged

  justification:
    src_directory: |
      - Prevents accidental imports from source tree during testing
      - Forces use of installed package (pip install -e .)
      - Standard layout recommended by PyPA

    tests_at_root: |
      - Tests are NOT part of installed package
      - Easier access for pytest discovery
      - Standard practice for test isolation

    scripts_decision: |
      Two options:
      Option A (RECOMMENDED): Convert to console_scripts in setup.py
        - Scripts become installed commands
        - No sys.path manipulation needed
        - Professional package distribution

      Option B: Keep scripts/ at root
        - Scripts remain standalone
        - Still need sys.path OR installed package
        - Less professional but more flexible

