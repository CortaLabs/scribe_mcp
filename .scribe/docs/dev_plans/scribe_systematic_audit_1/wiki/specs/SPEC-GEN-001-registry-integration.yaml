    # Use hash comparison (new behavior)
    is_new = all(baseline == current for baseline, current in zip(...))
else:
    # Fallback to file existence check (legacy behavior)
    is_new = not progress_log_path.exists()
```

**Recommendation**: Phase 6 should include a migration tool to backfill hashes for existing projects.

