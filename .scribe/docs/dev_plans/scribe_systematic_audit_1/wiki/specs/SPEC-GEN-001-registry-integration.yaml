## Testing Requirements

### Unit Test 1: Baseline Hash Recording
```python
async def test_gen_001_baseline_hash_recorded():
    """
    SPEC-GEN-001: Verify baseline_hashes populated after template creation.
    """
    from scribe_mcp.shared.project_registry import ProjectRegistry

    registry = ProjectRegistry()
    project_name = "test_gen_001_hashes"

    # Generate templates
    result = await generate_doc_templates(project_name=project_name)
    assert result["ok"] == True

    # Verify registry has baseline hashes for core docs
    project_info = registry.get_project(project_name)
    assert project_info is not None

    docs_meta = project_info.meta.get("docs", {})
    baseline_hashes = docs_meta.get("baseline_hashes", {})
    current_hashes = docs_meta.get("current_hashes", {})

    # Core docs should have hashes
    core_docs = ["architecture", "phase_plan", "checklist"]
    for doc in core_docs:
        assert doc in baseline_hashes, f"{doc} missing from baseline_hashes"
        assert doc in current_hashes, f"{doc} missing from current_hashes"
        assert baseline_hashes[doc] == current_hashes[doc], f"{doc} baseline != current (should be equal for pristine templates)"
```

### Unit Test 2: Hash Comparison for set_project
```python
async def test_gen_001_set_project_new_detection():
    """
    SPEC-GEN-001: Verify set_project can detect new vs existing via hash comparison.
    """
    project_name = "test_gen_001_detection"

    # Create project - should be "new"
    result1 = await set_project(name=project_name)
    assert result1["is_new"] == True

    # Call again immediately - docs still pristine, should still be "new"
    result2 = await set_project(name=project_name)
    assert result2["is_new"] == True  # Hashes match = pristine

    # Modify a document
    await manage_docs(
        action="replace_section",
        doc="architecture",
        section="problem_statement",
        content="## Problem Statement\nModified content\n"
    )

    # Call set_project again - docs modified, should be "existing"
    result3 = await set_project(name=project_name)
    assert result3["is_new"] == False  # Hashes don't match = modified
```

### Integration Test: BUG-001 Regression
```python
async def test_gen_001_bug_001_fixed():
    """
    SPEC-GEN-001: Verify BUG-001 (empty log treated as new) is fixed.

    With hash comparison, empty logs after rotation should still show as "existing"
    because docs have been modified.
    """
    project_name = "test_gen_001_bug_001"

    # Create and use project
    await set_project(name=project_name)
    await append_entry(message="Test entry", project=project_name)

    # Rotate log (creates empty PROGRESS_LOG.md)
    await rotate_log(project=project_name, confirm=True)

    # Call set_project - should be "existing" (docs modified)
    result = await set_project(name=project_name)
    assert result["is_new"] == False
    assert "inventory" in result
```

