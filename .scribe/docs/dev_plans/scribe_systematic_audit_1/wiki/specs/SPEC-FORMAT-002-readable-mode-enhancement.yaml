## get_project Readable Mode Investigation

### Current Behavior Analysis

**Readable Mode** (~2,400 chars):
- Project metadata (name, slug, root, status)
- Lifecycle information (created, last entry, last access)
- Activity metrics (entry count, activity score)
- **Recent activity (last 5 log entries)** ← EXTRA DATA

**Structured Mode** (651 chars):
- Project metadata only
- NO recent activity

**Discrepancy**: Readable includes additional context not in JSON

---

### Decision Tree

#### Option A: Bug - Remove Recent Activity

**Rationale**: Readable should be subset of structured (not superset)

**Fix**:
```python
def _format_readable(self, project_data: Dict, **kwargs) -> str:
    # Remove recent_activity inclusion
    # Show only metadata (matches structured scope)
    ...
```

**Result**: Readable ~650 chars (matches structured)

**Token Reduction**: 0% (same data, different format)

**Impact**: Consistent data across modes, loses UX feature

---

#### Option B: Feature - Add Verbosity Flag

**Rationale**: Recent activity is valuable UX, make it optional

**Fix**:
```python
async def get_project(
    project: str = None,
    format: str = "readable",
    verbose: bool = False,  # NEW parameter
    **kwargs
):
    """
    Get current project context.

    Args:
        project: Optional project name override
        format: Output format (readable/structured/compact)
        verbose: Include recent activity in readable mode (default: False)
    """
    ...

def _format_readable(self, project_data: Dict, verbose: bool = False, **kwargs):
    # Include recent activity only if verbose=True
    if verbose:
        # Current behavior (~2,400 chars)
    else:
        # Concise metadata only (~650 chars)
```

**Result**:
- Default: ~650 chars (consistent with structured)
- Verbose: ~2,400 chars (when user wants context)

**Token Reduction**: 73% (default mode)

**Impact**: Maintains UX feature with opt-in verbosity

---

#### Option C: Document as Feature

**Rationale**: Readable mode is for humans, extra context is intentional

**Fix**: None (document behavior in tool spec)

**Documentation**:
```markdown
## get_project Readable Mode

**Behavior**: Includes last 5 log entries for context (not in JSON modes)

**Rationale**: Human users benefit from recent activity summary

**Token Impact**: Readable mode is 4x larger than JSON (trade-off for UX)

**Alternative**: Use `format="structured"` for minimal output
```

**Impact**: No code changes, clear expectations

---

### Recommendation

**Choose Option B** (verbosity flag)

**Justification**:
1. Preserves UX feature (recent activity)
2. Allows token optimization (default=false)
3. Explicit user control (verbose=true when needed)
4. Consistent with structured mode data scope (default)

**Implementation Effort**: 1-2 hours

---

## Standardized Readable Mode Verbosity

### Guideline for All Tools

**Principle**: Readable mode should NOT include data absent from structured mode (unless explicitly requested via verbosity flag)

**Data Scope Rules**:
1. **Baseline**: Readable shows SAME data as structured, different format
2. **Enhanced**: Readable MAY include extra context if `verbose=True` parameter provided
3. **Forbidden**: Readable MUST NOT include surprise data without user opt-in

**Examples**:

**✅ GOOD** (list_projects):
- Structured: List of project dicts
- Readable: Formatted table of projects (same data, table format)

**✅ GOOD** (read_file):
- Structured: File metadata + content
- Readable: Formatted file with line numbers (same data, formatted)

**⚠️ QUESTIONABLE** (get_project current):
- Structured: Project metadata
- Readable: Project metadata + recent entries (EXTRA DATA - should be opt-in)

**❌ BAD** (hypothetical):
- Structured: Query results
- Readable: Query results + random suggestions (SURPRISE DATA)

---

### Implementation Checklist

**For Each Tool**:
- [ ] Verify readable shows same data scope as structured
- [ ] If readable adds context, make it opt-in via `verbose` parameter
- [ ] Document any verbosity flags in tool specification
- [ ] Test token reduction is ≥30% (or document why not)

