## 1. Problem Statement

`shared/project_registry.py` and other production files bypass the `StorageBackend` abstraction layer with direct `sqlite3.connect()` calls. This breaks PostgreSQL compatibility and creates a maintenance burden.

### Current Violations

| File | Violation Count | Impact |
|------|----------------|--------|
| shared/project_registry.py | 9 calls | CRITICAL - project lifecycle broken in PostgreSQL |
| plugins/vector_indexer.py | 1 call | MEDIUM - vector index PostgreSQL incompatible |
| shared/logging_utils.py | 1 call | MEDIUM - logging fallback broken |
| scripts/*.py | Multiple | LOW - migration scripts acceptable |

**Total Production Violations**: 11 direct sqlite3.connect() calls

---

## 2. Scope

### In Scope

1. Refactor `shared/project_registry.py` to use `StorageBackend`
2. Refactor `plugins/vector_indexer.py` to use abstraction or separate DB
3. Refactor `shared/logging_utils.py` to use `StorageBackend`
4. Add linting rule to prevent future violations
5. Add architecture tests enforcing abstraction

### Out of Scope

- Refactoring test files (tests/* can use direct access for verification)
- Refactoring scripts/* (migration/utility scripts acceptable)
- Refactoring storage backends themselves (sqlite.py, postgres.py)

