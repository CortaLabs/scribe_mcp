### 3.2 Refactor vector_indexer.py

**Current Violation** (line 331):
```python
self._db_conn = sqlite3.connect(str(self.mapping_db_path), check_same_thread=False)
```

**Decision Required**: Vector indexer uses SEPARATE database from main storage.

**Option A**: Keep separate DB (recommended)
- Vector index is isolated subsystem
- Doesn't need PostgreSQL support
- Minimal changes required

**Option B**: Integrate with StorageBackend
- Add vector_* tables to main schema
- Requires PostgreSQL migration
- Complex integration

**Recommendation**: Option A - Document as intentional exception

**Files Modified**:
- `plugins/vector_indexer.py` - Add docstring explaining separate DB rationale
- Add to architectural decision records

**Estimated Effort**: 2-4 hours (documentation only)

