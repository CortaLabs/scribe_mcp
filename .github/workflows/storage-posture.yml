name: Storage posture gate

on:
  pull_request:
    paths:
      - "src/scribe_mcp/config/**"
      - "src/scribe_mcp/storage/**"
      - "src/scribe_mcp/state/**"
      - "src/scribe_mcp/server.py"
      - "src/scribe_mcp/tools/doctor.py"
      - "tests/test_settings_schema_alias.py"
      - "tests/test_storage_factory_backends.py"
      - "tests/test_mode_detection.py"
      - "tests/test_server_storage_policy.py"
      - "tests/integration/storage/**"
      - "tests/README.md"
      - "pytest.ini"
      - ".github/workflows/storage-posture.yml"
  workflow_dispatch:

jobs:
  posture-suite:
    name: Posture suite (fail-closed + explicit standalone)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run focused storage posture suite
        env:
          SCRIBE_MODE: standalone
          SCRIBE_STORAGE_BACKEND: sqlite
        run: pytest -q tests/test_settings_schema_alias.py tests/test_storage_factory_backends.py tests/test_mode_detection.py tests/test_server_storage_policy.py

      - name: Run Postgres-marked integration storage lane
        run: pytest -q tests/integration/storage -m postgres
