## Testing Strategy

### Test Coverage

**Test Cases** (per tool):
1. `format="readable"` → Returns string with boxes/colors
2. `format="structured"` → Returns full JSON dict
3. `format="compact"` → Returns abbreviated JSON dict
4. Compact mode NOT identical to structured (byte-level comparison)
5. Compact mode 20-30% smaller than structured
6. Invalid format value → Raises ValueError

**Test Implementation**:
```python
import pytest
from scribe_mcp.tools.list_projects import list_projects

async def test_list_projects_format_modes():
    # Test readable mode
    result = await list_projects(format="readable")
    assert isinstance(result, str)
    assert "╔" in result  # Box drawing present

    # Test structured mode
    result = await list_projects(format="structured")
    assert isinstance(result, dict)
    assert "projects" in result
    structured_size = len(json.dumps(result))

    # Test compact mode
    result = await list_projects(format="compact")
    assert isinstance(result, dict)
    compact_size = len(json.dumps(result))

    # Verify compact is NOT identical to structured
    assert compact_size < structured_size

    # Verify 20-30% reduction
    reduction = (structured_size - compact_size) / structured_size
    assert 0.20 <= reduction <= 0.35

    # Test invalid format
    with pytest.raises(ValueError):
        await list_projects(format="invalid")
```

