# Technical Design

## Architecture

### Base Class Approach

**Create `BaseFormattedTool` base class** with standard format dispatch:

```python
class BaseFormattedTool:
    """Base class for tools with format parameter support."""

    def format_response(
        self,
        data: Any,
        format: str = "readable",
        **kwargs
    ) -> Union[str, Dict]:
        """
        Dispatch response formatting based on format parameter.

        Args:
            data: Raw response data
            format: Output format (readable/structured/compact)
            **kwargs: Additional formatting options

        Returns:
            Formatted response (str for readable, dict for JSON modes)
        """
        if format == "readable":
            return self._format_readable(data, **kwargs)
        elif format == "structured":
            return self._format_structured(data, **kwargs)
        elif format == "compact":
            return self._format_compact(data, **kwargs)
        else:
            raise ValueError(f"Unknown format: {format}")

    def _format_readable(self, data: Any, **kwargs) -> str:
        """
        Format as human-readable text with boxes/colors.

        Subclasses SHOULD override this for custom readable output.
        """
        raise NotImplementedError("Tool must implement _format_readable()")

    def _format_structured(self, data: Any, **kwargs) -> Dict:
        """
        Format as full JSON with all fields.

        Default implementation returns data as-is.
        Subclasses MAY override for custom structured output.
        """
        return data

    def _format_compact(self, data: Any, **kwargs) -> Dict:
        """
        Format as compact JSON with short field names.

        Default implementation uses ResponseFormatter.format_entry()
        for compact field mapping.

        Subclasses MAY override for custom compact logic.
        """
        from scribe_mcp.utils.response import ResponseFormatter
        formatter = ResponseFormatter()

        if isinstance(data, dict):
            return formatter.format_entry(data, compact=True, **kwargs)
        elif isinstance(data, list):
            return {
                "ok": True,
                "d": [formatter.format_entry(item, compact=True, **kwargs)
                      for item in data],
                "c": len(data)
            }
        else:
            return data
```

**Impact**: All tools inherit standardized format dispatch

