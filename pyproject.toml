[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scribe-mcp"
version = "2.5.0"
description = "Scribe MCP server, tooling, and universal CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Scribe-MCP-Community-1.0"
license-files = ["LICENSE"]
authors = [{ name = "Scribe MCP Contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "asyncpg~=0.29",
  "httpx~=0.27",
  "jinja2~=3.1",
  "mcp==1.26.0",
  "markdown-it-py~=3.0",
  "portalocker~=2.0",
  "python-dotenv~=1.0",
  "psutil~=7.1",
  "pyyaml~=6.0",
  "rich~=13.7",
  "tiktoken~=0.5",
  "watchdog~=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest~=7.4",
  "pytest-asyncio~=0.23",
]
s3 = ["boto3>=1.28"]

[project.urls]
Homepage = "https://github.com/CortaLabs/scribe_mcp"
Documentation = "https://github.com/CortaLabs/scribe_mcp/blob/main/docs/INSTALL_AND_BOOTSTRAP.md"
Repository = "https://github.com/CortaLabs/scribe_mcp"
Issues = "https://github.com/CortaLabs/scribe_mcp/issues"

[project.scripts]
scribe = "scribe_mcp.cli.main:main"
scribe-mcp = "scribe_mcp.__main__:main"
scribe-server = "scribe_mcp.__main__:main"
scribe-migrate = "scribe_mcp.scripts.migrate_state:main"
scribe-migrate-postgres = "scribe_mcp.scripts.migrate_sqlite_to_postgres:main"
scribe-backup-postgres = "scribe_mcp.scripts.postgres_backup:main"
scribe-restore-postgres = "scribe_mcp.scripts.postgres_restore:main"
scribe-bootstrap-postgres = "scribe_mcp.scripts.bootstrap_postgres:main"
scribe-metrics-postgres = "scribe_mcp.scripts.postgres_metrics:main"
scribe-soak-postgres = "scribe_mcp.scripts.postgres_soak_test:main"
scribe-server-sse = "scribe_mcp.server_sse:main"
scribe-migrate-objects = "scribe_mcp.scripts.migrate_to_object_store:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["scribe_mcp*"]

[tool.setuptools.package-data]
"scribe_mcp" = [
  "py.typed",
  "config/*.json",
  "config/*.yaml",
  "config/*.yml",
  "db/*.sql",
  "db/postgres_migrations/*.sql",
  "plugins/*.json",
  "templates/*",
  "templates/**/*",
]

[tool.setuptools.data-files]
"share/doc/scribe-mcp" = [
  "README.md",
  "docs/INSTALL_AND_BOOTSTRAP.md",
  "docs/TOUR.md",
  "docs/DOCUMENT_TOPOLOGY.md",
  "docs/COMPATIBILITY_MATRIX.md",
  "docs/RELEASE_SURFACE.md",
  "docs/RELEASE_FILE_MAP.md",
  "docs/Scribe_Usage.md",
  "docs/mcp_server_guide.md",
  "docs/REMOTE_CLIENT.md",
  "docs/BRIDGE_DEVELOPMENT.md",
  "docs/TEMPLATE_VARIABLES.md",
  "docs/GLOBAL_DEPLOYMENT_GUIDE.md",
  "docs/STARTUP_PROBE_CONTRACT.md",
  "docs/next_steps.md",
  "deploy/README.md",
]
"share/doc/scribe-mcp/examples" = [
  "docs/examples/mcp.json.example",
  "docs/examples/opencode.json.example",
]
"share/doc/scribe-mcp/skills/scribe-integration" = [
  "skills/scribe-integration/SKILL.md",
]
"share/doc/scribe-mcp/guides" = [
  "docs/guides/LIVE_MCP_IMPACT_REPORT_2026-04-17.md",
  "docs/guides/hooks_setup.md",
  "docs/guides/manage_docs_agent_guide.md",
  "docs/guides/manage_docs_troubleshooting.md",
  "docs/guides/scribe_onboarding_prompt.md",
]
"share/doc/scribe-mcp/whitepapers" = [
  "docs/whitepapers/scribe_mcp_whitepaper.md",
]

[tool.setuptools.exclude-package-data]
"scribe_mcp" = [
  "council_templates/*",
  "council_templates/**/*",
]
"scribe_mcp.council_templates" = [
  "__pycache__/*",
  "rules/*",
  "rules/**/*",
  "skills/*",
  "skills/**/*",
]
