# Problem Statement

## Issue #1: rotate_log Has NO Readable Mode

**Current Behavior**: rotate_log ignores `format` parameter, returns JSON for ALL modes

**Evidence**:
- `format="readable"` → JSON (429 chars)
- `format="structured"` → JSON (429 chars)
- `format="compact"` → JSON (429 chars)

**Impact**: No human-readable summary for log rotation operations

**Expected Behavior**: Readable mode should provide box-formatted summary

---

## Issue #2: get_project Readable Mode Bloat

**Current Behavior**: Readable mode is 4x LARGER than structured mode

**Evidence**:
- `format="readable"` → ~2,400 chars (includes last 5 log entries)
- `format="structured"` → 651 chars (omits recent activity)

**Impact**: Readable mode defeats token optimization purpose

**Question**: Is this intentional (UX) or bug (data inclusion)?

---

# Goals

## Primary Objectives

1. **Add readable mode to rotate_log** (BUG-FORMAT-004)
2. **Investigate get_project readable bloat** (determine if bug or feature)
3. **Standardize readable mode verbosity** (avoid unexpected data inclusion)
4. **Achieve target token reductions** (40-50% for rotate_log)

## Success Criteria

- ✅ rotate_log readable mode reduces tokens 40-50% vs JSON
- ✅ get_project readable mode decision documented (fix or feature)
