# ============================================================================
# RISK ASSESSMENT
# ============================================================================

risks:
  - risk_id: RISK-001
    description: "Temp file orphaning due to crash"
    probability: medium
    impact: low
    mitigation: |
      - Add cleanup on next rotation (detect orphaned .rotation_tmp files)
      - Document temp file naming convention
      - Add monitoring for orphaned temp files

  - risk_id: RISK-002
    description: "Rollback failure leaves system in critical state"
    probability: low
    impact: critical
    mitigation: |
      - Extensive testing of rollback scenarios
      - Manual intervention documentation
      - Alerting on CRITICAL rollback failures
      - Regular backup of log files

  - risk_id: RISK-003
    description: "Performance regression in fallback path"
    probability: low
    impact: medium
    mitigation: |
      - Fallback only triggered when primary rotation fails
      - Additional I/O minimal compared to rotation cost
      - Performance testing before deployment

# ============================================================================
# NOTES & REFERENCES
# ============================================================================

notes: |
  This spec addresses a CRITICAL atomicity violation discovered during
  systematic audit of rotate_log.py (Wave 1, ResearchAgent-D-RotateLog).

  The current implementation (lines 1021-1063) performs non-atomic
  operations that can leave the system in an inconsistent state on
  failure. This spec provides a production-ready atomic implementation
  with comprehensive rollback semantics.

  The proposed solution adds minimal overhead (2 extra rename operations)
  while guaranteeing system consistency under all failure scenarios.

