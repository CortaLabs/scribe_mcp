name: Clean-room install gate

# Builds the scribe-mcp wheel and installs it into a FRESH venv (not editable,
# not the repo working tree), then asserts the packaging surface: runtime
# version truth, vendored-asset projection from site-packages, the expected
# shipped skill set, and Codex plugin projection onto disk. This catches
# packaging gaps (e.g. plugin bundles shipping only one skill) automatically.
#
# This job is intentionally SEPARATE from publish-pypi.yml so it never blocks a
# release on transient build/network flakiness; it runs on PR + push so gaps are
# caught before they ship.
#
# COVERAGE BOUNDARY: this verifies the PACKAGING SURFACE only (install path,
# asset projection, version, skill presence, codex projection). It does NOT boot
# the MCP server against a live Postgres runtime — that is covered by other
# workflows. See scripts/cleanroom_install_check.py for the full scope note.

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "MANIFEST.in"
      - "src/scribe_mcp/**"
      - "plugins/**"
      - "scripts/build_release_dists.sh"
      - "scripts/cleanroom_install_check.py"
      - "scripts/sync_plugin_skills.py"
      - ".github/workflows/clean-room-install.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "pyproject.toml"
      - "MANIFEST.in"
      - "src/scribe_mcp/**"
      - "plugins/**"
      - "scripts/build_release_dists.sh"
      - "scripts/cleanroom_install_check.py"
      - "scripts/sync_plugin_skills.py"
      - ".github/workflows/clean-room-install.yml"
  workflow_dispatch:

concurrency:
  group: clean-room-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-room-install:
    name: Clean-room wheel install + asset projection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Run clean-room install check
        run: python scripts/cleanroom_install_check.py
