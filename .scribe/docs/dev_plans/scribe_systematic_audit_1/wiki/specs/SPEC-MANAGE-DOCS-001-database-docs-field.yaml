### Phase 2: Data Backfill

**File:** Migration script or tools/project_utils.py

**Backfill Strategy:**
```python
import json
import sqlite3
from pathlib import Path
from scribe_mcp.config.settings import settings

def backfill_docs_json():
    """Backfill docs_json column from state.json for existing projects."""

    # 1. Load state.json
    state_path = Path(settings.repo_root) / ".scribe" / "state.json"
    if not state_path.exists():
        print("No state.json found, skipping backfill")
        return

    with open(state_path, 'r') as f:
        state_data = json.load(f)

    projects = state_data.get("projects", {})

    # 2. For each project in state.json
    with sqlite3.connect(settings.sqlite_path) as conn:
        for project_name, project_data in projects.items():
            docs = project_data.get("docs")
            if not docs:
                continue

            # 3. UPDATE database with docs_json
            docs_json = json.dumps(docs)
            conn.execute(
                "UPDATE scribe_projects SET docs_json = ? WHERE name = ?",
                (docs_json, project_name)
            )
            print(f"✅ Backfilled docs_json for {project_name}")

        conn.commit()

    print(f"✅ Backfill complete for {len(projects)} projects")
```

**Verification:**
```sql
-- Check backfill results
SELECT name,
       LENGTH(docs_json) as docs_json_size,
       CASE WHEN docs_json IS NULL THEN 'NULL' ELSE 'HAS DATA' END as status
FROM scribe_projects;
```

