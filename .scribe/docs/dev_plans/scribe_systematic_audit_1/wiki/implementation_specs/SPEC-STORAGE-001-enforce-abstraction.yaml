## 7. Architecture Test

**File**: `tests/test_storage_abstraction.py`

```python
"""Test that storage abstraction layer is properly enforced."""

import ast
import glob
from pathlib import Path

def test_no_production_code_uses_direct_db_access():
    """Ensure production code uses StorageBackend, not direct access."""
    violations = []

    # Files that ARE allowed to use direct access
    allowed = [
        'storage/sqlite.py',
        'storage/postgres.py',
        'db/ops.py',
        'db/pool.py',
        'plugins/vector_indexer.py',  # Documented exception
    ]

    # Scan all Python files
    for py_file in glob.glob('**/*.py', recursive=True):
        # Skip tests and scripts
        if 'tests/' in py_file or 'scripts/' in py_file:
            continue

        # Skip allowed files
        if any(allowed_file in py_file for allowed_file in allowed):
            continue

        # Parse and check for violations
        with open(py_file) as f:
            tree = ast.parse(f.read())

        for node in ast.walk(tree):
            if isinstance(node, ast.Call):
                # Check for sqlite3.connect()
                if (isinstance(node.func, ast.Attribute) and
                    node.func.attr == 'connect' and
                    isinstance(node.func.value, ast.Name) and
                    node.func.value.id == 'sqlite3'):
                    violations.append(f"{py_file}:{node.lineno} - Direct sqlite3.connect()")

            elif isinstance(node, ast.Import):
                # Check for asyncpg imports
                for alias in node.names:
                    if alias.name == 'asyncpg':
                        violations.append(f"{py_file}:{node.lineno} - Direct asyncpg import")

    assert len(violations) == 0, f"Storage abstraction violations:\n" + "\n".join(violations)
```

