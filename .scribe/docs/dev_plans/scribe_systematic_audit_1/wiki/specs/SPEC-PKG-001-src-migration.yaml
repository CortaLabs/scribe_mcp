# ============================================================================
# APPENDIX: EDGE CASES AND SPECIAL HANDLING
# ============================================================================

edge_cases:
  case_1_pytest_discovery:
    issue: "pytest may not find tests after migration"
    solution: |
      Add to pyproject.toml:
      [tool.pytest.ini_options]
      testpaths = ["tests"]
      pythonpath = ["."]

  case_2_template_loading:
    issue: "Jinja2 templates may not load from installed package"
    solution: |
      Use importlib.resources or pkg_resources for template loading:
      from importlib.resources import files
      template_dir = files('scribe_mcp').joinpath('templates')

  case_3_config_file_paths:
    issue: "Config files may have hardcoded paths"
    solution: |
      Audit config/settings.py for Path(__file__) usage
      Use package-relative paths

  case_4_venv_in_scribe_mcp:
    issue: ".venv directory inside scribe_mcp/ may cause confusion"
    solution: |
      Move .venv to MCP_SPINE level (parent directory)
      Update .gitignore accordingly

