## Migration Risks

### Risk 1: Breaking Changes

**Concern**: Existing tool behavior changes

**Mitigation**:
- Maintain backward compatibility (default formats unchanged)
- Add deprecation warnings if format behavior shifts
- Version bump to indicate API change

---

### Risk 2: Performance Impact

**Concern**: Format dispatch adds latency

**Mitigation**:
- Base class dispatch is minimal (simple if/elif)
- Compact formatting is faster than readable (less string manipulation)
- Test performance with high-frequency tools

---

### Risk 3: Tool-Specific Edge Cases

**Concern**: Some tools have unique output structures

**Mitigation**:
- Allow tools to override `_format_compact()` for custom logic
- Document edge cases in tool specifications
- Test each tool individually

