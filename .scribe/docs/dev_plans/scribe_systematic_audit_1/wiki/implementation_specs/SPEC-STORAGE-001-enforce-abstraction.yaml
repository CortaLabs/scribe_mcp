## 3. Technical Specification

### 3.1 Refactor project_registry.py

**Current State** (648 LOC, 9 violations):
```python
# VIOLATION - Direct sqlite3 access
with sqlite3.connect(self._db_path) as conn:
    conn.execute("UPDATE scribe_projects SET ...")
```

**Target State**:
```python
class ProjectRegistry:
    def __init__(self, storage: StorageBackend):
        self._storage = storage

    async def touch_access(self, project_name: str) -> None:
        """Update last_access_at via abstraction."""
        project = await self._storage.fetch_project(project_name)
        if project:
            # Use new abstraction method
            await self._storage.update_project_access(project_name)
```

**New Abstraction Methods Required**:

```python
# Add to storage/base.py
class StorageBackend(ABC):
    @abstractmethod
    async def update_project_access(self, project_name: str) -> None:
        """Update last_access_at timestamp."""

    @abstractmethod
    async def update_project_metadata(
        self,
        project_name: str,
        description: Optional[str] = None,
        tags: Optional[List[str]] = None,
        meta: Optional[Dict[str, Any]] = None
    ) -> None:
        """Update project metadata fields."""

    @abstractmethod
    async def update_project_entry_timestamp(
        self,
        project_name: str,
        log_type: Optional[str] = None
    ) -> None:
        """Update last_entry_at and apply lifecycle rules."""

    @abstractmethod
    async def get_project_stats(
        self,
        project_name: str
    ) -> Dict[str, Any]:
        """Get project statistics (entry counts, last access, etc.)."""
```

**Files Modified**:
- `storage/base.py` - Add 4 new abstract methods
- `storage/sqlite.py` - Implement 4 methods
- `storage/postgres.py` - Implement 4 methods (delegate to db/ops.py)
- `db/ops.py` - Add PostgreSQL implementations
- `shared/project_registry.py` - Refactor to async, use StorageBackend

**Estimated Effort**: 16-24 hours

