## 3. Technical Specification

### 3.1 Priority 1: Critical Infrastructure (delete_project)

**Files Modified**: `db/ops.py`

```python
async def delete_project(pool: asyncpg.Pool, name: str) -> bool:
    """
    Delete a project and all associated data via CASCADE.

    Returns:
        True if project was deleted, False if not found
    """
    async with pool.acquire() as conn:
        # Fetch project first
        project = await conn.fetchrow(
            "SELECT id FROM scribe_projects WHERE name = $1", name
        )

        if not project:
            return False

        # DELETE CASCADE handles all foreign keys
        await conn.execute(
            "DELETE FROM scribe_projects WHERE name = $1", name
        )

        return True
```

**Testing**:
- Verify CASCADE deletes all related entries
- Confirm foreign key relationships
- Test with non-existent project

**Estimated Effort**: 4-8 hours

