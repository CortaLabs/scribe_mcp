    max_retries: 3
  federation:
    enabled: false
    transport:
      receive_path: /api/v1/federation/receive
      timeout_seconds: 30
      max_payload_bytes: 1048576
    idempotency:
      ttl_hours: 72
    ipc:
      notify_channel: federation_events
    scribe:
      proxy_enabled: false
      meta_tag_prefix: fed
    hierarchy:
