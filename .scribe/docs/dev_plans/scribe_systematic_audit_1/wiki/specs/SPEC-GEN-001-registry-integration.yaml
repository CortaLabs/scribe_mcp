## Integration Details

### Hash Computation
- **Algorithm**: SHA256 (matches manage_docs pattern)
- **Content**: `rendered` variable (the template content after Jinja2/legacy rendering)
- **Encoding**: UTF-8 (standard for text content)
- **Method**: `hashlib.sha256(rendered.encode('utf-8')).hexdigest()`

### ProjectRegistry.record_doc_update() Parameters

| Parameter | Value | Rationale |
|-----------|-------|-----------|
| `project_name` | `project_name` (from function arg) | Current project context |
| `doc` | `key` (loop variable) | Document type: "architecture", "phase_plan", etc. |
| `action` | `"template_created"` | Semantic action for audit trail |
| `before_hash` | `None` | New template has no prior state |
| `after_hash` | `content_hash` | SHA256 of rendered template |

### Registry Behavior (from shared/project_registry.py:227-234)

**Line 229**: `if doc not in baseline_map and before_hash:`
- For new templates, `before_hash=None`, so this condition is **False**
- **BUT** line 231-232 will still set `current_map[doc] = after_hash`

**Actually, we need to check the logic more carefully:**

Looking at project_registry.py lines 227-234:
```python
baseline_map = docs_meta.get("baseline_hashes") or {}
current_map = docs_meta.get("current_hashes") or {}
if doc not in baseline_map and before_hash:
    baseline_map[doc] = before_hash
if after_hash:
    current_map[doc] = after_hash
```

**For templates (`before_hash=None`, `after_hash=content_hash`)**:
- Line 229: Condition is False (before_hash is None)
- **Problem**: baseline_map is NOT set!

**CORRECTED UNDERSTANDING**:
The current ProjectRegistry logic has a bug for this use case. We need:

```python
# Correct logic for new templates
if doc not in baseline_map:
    if before_hash:
        baseline_map[doc] = before_hash
    elif after_hash:
        baseline_map[doc] = after_hash  # First write sets baseline
```

**OR** we should pass `before_hash=after_hash` for new templates to set baseline correctly.

**DECISION**: Use `before_hash=content_hash, after_hash=content_hash` for new templates to ensure baseline is set correctly with current ProjectRegistry logic.

### Updated Integration Code

```python
# Record baseline hash for doc lifecycle tracking
try:
    content_hash = hashlib.sha256(rendered.encode('utf-8')).hexdigest()
    _PROJECT_REGISTRY.record_doc_update(
        project_name,
        doc=key,
        action="template_created",
        before_hash=content_hash,  # Set baseline on creation
        after_hash=content_hash,   # Same value = pristine state
    )
except Exception:
    pass  # Best-effort: Don't fail template generation
```

**Rationale**: Setting both before_hash and after_hash to the same value creates the semantic "pristine template" state that set_project can detect.

