spec_id: SPEC-TOKEN-002
title: append_entry Token Optimization
version: 1.0.0
created: 2026-01-05
author: ResearchAgent-Phase5-TokenAnalyzer
status: draft
priority: critical

# ============================================================================
# PROBLEM STATEMENT
# ============================================================================

problem:
  description: |
    append_entry is the HIGHEST FREQUENCY tool in the entire system, called after
    every meaningful action (100+ times per day). Despite moderate token count (136),
    its call frequency makes it the #1 contributor to daily token consumption (13,600+ tokens/day).

  bloat_analysis:
    total_tokens: 136
    bloat_structural: 15    # Emoji, spacing (11%)
    bloat_metadata: 40      # Full timestamp, redundant project name (29%)
    bloat_safety: 15        # File path footer (11%)
    bloat_duplication: 0    # Minimal duplication
    core_information: 66    # Actual message content (49%)

  call_frequency:
    per_day: 100  # Conservative estimate
    per_week: 700
    per_month: 3000
    per_year: 36500

  impact:
    daily_tokens: 13600
    weekly_tokens: 95200
    monthly_tokens: 408000
    yearly_tokens: 4964000  # ~5 million tokens/year

# ============================================================================
# REDUCTION TARGETS
# ============================================================================

targets:
  readable_mode:
    current: 136
    target: 85
    reduction_tokens: 51
    reduction_percent: 37

  compact_mode:
    current: null  # Not yet implemented
    target: 45
    description: "Minimal success confirmation with essential metadata only"

  daily_impact:
    calls_per_day: 100
    current_cost: 13600
    optimized_cost: 8500
    daily_savings: 5100
    annual_savings: 1861500  # 1.86 million tokens/year

# ============================================================================
# IMPLEMENTATION SPECIFICATION
# ============================================================================

implementation:

  # PHASE 1: Readable Mode Refinement
  readable_mode:
    changes:
      - action: remove
        target: redundant_prefix
        description: "Remove 'Entry written to progress log' prefix"
        current: "✅ Entry written to progress log (scribe_systematic_audit_1_phase5_tool_output)"
        proposed: "✅"
        token_savings: 10

      - action: remove
        target: redundant_project_name
        description: "Remove project name from first line (already in context)"
        token_savings: 20

      - action: shorten
        target: timestamp
        description: "Use HH:MM UTC instead of full ISO 8601"
        current: "[2026-01-05 14:34:25 UTC]"
        proposed: "14:34 UTC"
        token_savings: 8

      - action: remove
        target: bracketed_labels
        description: "Remove [ℹ️], [Agent:], [Project:] brackets"
        token_savings: 12

      - action: shorten
        target: file_path
        description: "Use relative path instead of absolute"
        current: "📁 .scribe/docs/dev_plans/scribe_systematic_audit_1_phase5_tool_output/PROGRESS_LOG.md"
        proposed: "📁 PROGRESS_LOG.md"
        token_savings: 30

      - action: filter
        target: default_metadata
        description: "Remove redundant default metadata (priority=low, log_type=progress, content_type=log)"
        token_savings: 15

    preserve:
      - "Status emoji (✅/⚠️/❌) - information dense"
      - "Core message content"
      - "Agent name"
      - "Essential metadata (custom key=value pairs)"
      - "Reasoning chain (if present)"

    before_example: |
      ✅ Entry written to progress log (scribe_systematic_audit_1_phase5_tool_output)
         [ℹ️] [2026-01-05 14:34:25 UTC] [Agent: PhaseTestAgent] [Project: scribe_systematic_audit_1_phase5_tool_output] Test message for append_entry readable mode - Phase 5 tool output recording | phase=5; test_mode=readable; unicode_test=日本語🎯; priority=low; log_type=progress; content_type=log

      📁 .scribe/docs/dev_plans/scribe_systematic_audit_1_phase5_tool_output/PROGRESS_LOG.md

    after_example: |
      ✅ Test message for append_entry readable mode - Phase 5 tool output recording
         14:34 UTC | PhaseTestAgent | phase=5; test_mode=readable; unicode_test=日本語🎯
      📁 PROGRESS_LOG.md

    file_modified: tools/append_entry.py
    function_modified: _format_readable_response()

  # PHASE 2: Compact Mode Implementation
  compact_mode:
    description: "Minimal success confirmation - just emoji and message"

    output_format: |
      ✅ {message}

    example_simple: |
      ✅ Database migration completed

    example_with_metadata: |
      ✅ Bug fixed in authentication module
      🔧 component=auth, severity=high

    rules:
      - "Single line for simple messages (no metadata)"
      - "Two lines if metadata present (emoji + message, then metadata line)"
      - "No timestamps, no agent names, no file paths"
      - "Metadata on separate line with tool emoji (🔧)"

    file_modified: tools/append_entry.py
    function_modified: _format_compact_response()

  # PHASE 3: Bulk Mode Optimization
  bulk_mode:
    description: "When multiple entries logged at once (items parameter)"

    changes:
      - action: aggregate
        target: success_confirmation
        description: "Single confirmation for all entries, not per-entry"
        current: "Multiple '✅ Entry written...' messages"
        proposed: "✅ {count} entries written"

      - action: compress
        target: entry_list
        description: "Compact list format"

    before_example: |
      ✅ Entry written to progress log (project)
         [ℹ️] [2026-01-05 14:34:25 UTC] [Agent: CoderAgent] Analyzed authentication flow | ...

      ✅ Entry written to progress log (project)
         [ℹ️] [2026-01-05 14:34:26 UTC] [Agent: CoderAgent] Found JWT expiry bug | ...

      ✅ Entry written to progress log (project)
         [ℹ️] [2026-01-05 14:34:27 UTC] [Agent: CoderAgent] Implemented fix | ...

    after_example: |
      ✅ 3 entries written
         • Analyzed authentication flow
         • Found JWT expiry bug
         • Implemented fix
      📁 PROGRESS_LOG.md

    token_comparison:
      before: 408  # 136 × 3
      after: 95
      savings: 313  # 77% reduction for bulk operations

# ============================================================================
# CONFIGURATION INTEGRATION
# ============================================================================

configuration:
  file: .scribe/config/scribe.yaml
  section: display.append_entry

  options:
    verbosity:
      type: integer
      default: 1
      values:
        0: minimal   # Compact mode (just emoji + message)
        1: standard  # Refined readable (default)
        2: verbose   # Current behavior

    show_file_path:
      type: boolean
      default: true
      description: "Show file path footer"

    timestamp_format:
      type: string
      default: "short"
      values:
        short: "HH:MM UTC"
        full: "ISO 8601 with timezone"
        none: "No timestamp"

    show_agent:
      type: boolean
      default: true
      description: "Show agent name in output"

    filter_default_metadata:
      type: boolean
      default: true
      description: "Hide default metadata (priority=low, log_type=progress)"

  example_config: |
    display:
      verbosity: 1
      append_entry:
        show_file_path: true
        timestamp_format: "short"
        show_agent: true
        filter_default_metadata: true

# ============================================================================
# TESTING REQUIREMENTS
# ============================================================================

tests:
  unit_tests:
    - test_readable_mode_refinement:
        description: "Verify readable output matches refined format"
        assertions:
          - "No 'Entry written to progress log' prefix"
          - "Timestamp is HH:MM UTC format"
          - "File path is relative (PROGRESS_LOG.md)"
          - "Token count < 90"
          - "Core message preserved"
          - "Custom metadata preserved"

    - test_compact_mode:
        description: "Verify compact mode is truly minimal"
        assertions:
          - "Output is 1-2 lines maximum"
          - "No timestamp, no agent, no file path"
          - "Token count < 50"
          - "Core message preserved"

    - test_bulk_mode_optimization:
        description: "Verify bulk mode aggregates confirmations"
        assertions:
          - "Single confirmation for multiple entries"
          - "Entry count shown (N entries written)"
          - "Token reduction ~75% vs individual confirmations"

  integration_tests:
    - test_format_parameter:
        description: "Verify format parameter routes correctly"
        scenarios:
          - format: readable
            expected: "Refined readable output"
          - format: compact
            expected: "Minimal 1-2 line output"
          - format: structured
            expected: "JSON response"

    - test_metadata_filtering:
        description: "Verify default metadata is filtered when configured"
        scenarios:
          - config: filter_default_metadata=true
            input_meta: "phase=5; priority=low; log_type=progress"
            expected: "phase=5" # Only custom metadata shown

    - test_unicode_handling:
        description: "Verify unicode content preserved in all modes"
        input: "unicode_test=日本語🎯"
        expected: "日本語🎯 rendered correctly"

    - test_reasoning_chain:
        description: "Verify reasoning chain formatting (when present)"
        assertions:
          - "Reasoning section preserved"
          - "Why/What/How structure maintained"

  regression_tests:
    - test_backward_compatibility:
        description: "Verify existing workflows still function"
        scenarios:
          - "Single entry append"
          - "Bulk entry append (items parameter)"
          - "Entry with reasoning chain"
          - "Entry with custom metadata"

  performance_tests:
    - test_token_reduction:
        description: "Verify token reduction targets achieved"
        assertions:
          - "Readable mode: < 90 tokens"
          - "Compact mode: < 50 tokens"
          - "Bulk mode: > 75% reduction"

# ============================================================================
# VERIFICATION CRITERIA
# ============================================================================

success_criteria:
  - criterion: token_reduction
    target: "37% reduction in readable mode, 67% in compact mode"
    measurement: "tiktoken cl100k_base encoding"

  - criterion: information_preservation
    target: "100% message content + custom metadata retained"
    verification: "All core information present in output"

  - criterion: readability_maintained
    target: "Refined output is clearer than original"
    verification: "Manual review confirms improved clarity"

  - criterion: bulk_mode_efficiency
    target: "> 75% token reduction for bulk operations"
    verification: "Aggregate confirmation instead of per-entry"

  - criterion: high_frequency_impact
    target: "5,100 tokens/day savings (37% of 13,600)"
    verification: "Measured in production usage"

# ============================================================================
# IMPACT ANALYSIS
# ============================================================================

impact:
  token_savings:
    per_call: 51  # tokens
    per_day: 5100  # 100 calls × 51 tokens
    per_month: 153000
    per_year: 1861500  # 1.86 million tokens/year

  cost_savings:
    # At $0.01 per 1K input tokens
    per_year_usd: 18.62  # per developer
    team_10_devs: 186.20
    team_50_devs: 931.00

  developer_experience:
    benefits:
      - "Cleaner, less verbose output"
      - "Easier to scan multiple log confirmations"
      - "Faster feedback loop (less to read)"
      - "Reduced cognitive load from noise"

# ============================================================================
# IMPLEMENTATION NOTES
# ============================================================================

notes:
  - "CRITICAL: append_entry is called 100+ times/day - every token counts"
  - "Default metadata filtering must be conservative (only hide truly redundant fields)"
  - "Compact mode should be opt-in via configuration, not default"
  - "Bulk mode optimization has outsized impact (75% reduction)"
  - "Reasoning chain must always be preserved when present (critical for audit trail)"
  - "Unicode handling is essential (日本語, emoji, etc.)"

# ============================================================================
# CROSS-REFERENCES
# ============================================================================

cross_references:
  specs:
    - SPEC-TOKEN-001 (list_projects optimization)
    - SPEC-TOKEN-003 (global output refinement)
  deliverables:
    - wiki/analysis/token_measurement_report.md
    - wiki/analysis/high_frequency_tool_optimization.md
  tools:
    - append_entry (primary)
    - append_event (similar patterns)
