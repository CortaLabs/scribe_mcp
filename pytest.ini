[pytest]
# Register the shipped release-suite contract.
# Fast hermetic lane: pytest -q tests/core -m "not slow and not performance"
markers =
    core: marks hermetic shipped-core tests under tests/core
    integration: marks integration tests under tests/integration
    postgres: marks tests or parametrizations that require Postgres
    manual: marks tests that require deliberate operator setup
    slow: marks tests as slow (deselect with -m "not slow")
    performance: marks tests as performance tests (run with -m performance)

# Enforce the registered marker contract without forcing a global default lane.
addopts = --strict-markers

# Filter warnings to suppress noise and prevent future breakage
filterwarnings =
    # Suppress distutils deprecation warnings from FAISS and setuptools
    ignore::DeprecationWarning:distutils.*
    ignore::DeprecationWarning:setuptools._distutils.*
    # Third-party warning noise that is not actionable in this repo
    ignore:Please use `import python_multipart` instead\.:PendingDeprecationWarning:starlette.formparsers
    ignore:builtin type .* has no __module__ attribute:DeprecationWarning
    # Keep important warnings from our own code
    default::DeprecationWarning:scribe_mcp.*
    # Show user warnings and other important warnings
    default::UserWarning
    default::RuntimeWarning

# Show captured output for failed tests (use -s or --tb=short for more detail)

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*
