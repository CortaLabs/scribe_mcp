## Technical Design

### Phase 1: Database Schema Migration

**File:** `storage/sqlite.py` or migration script

**Add Column:**
```sql
-- Add docs_json column to store document mappings
ALTER TABLE scribe_projects ADD COLUMN docs_json TEXT;
```

**Schema After Migration:**
```sql
CREATE TABLE scribe_projects (
    -- Existing columns (16)
    id INTEGER PRIMARY KEY,
    name TEXT NOT NULL,
    repo_root TEXT NOT NULL,
    progress_log_path TEXT NOT NULL,
    created_at TEXT DEFAULT CURRENT_TIMESTAMP,
    updated_at TEXT DEFAULT CURRENT_TIMESTAMP,
    status TEXT DEFAULT 'planning',
    phase TEXT DEFAULT 'setup',
    confidence REAL DEFAULT 0.0,
    completed_at TIMESTAMP,
    last_activity TIMESTAMP,
    description TEXT,
    last_entry_at TEXT,
    last_access_at TEXT,
    last_status_change TEXT,
    tags TEXT,
    meta TEXT,

    -- NEW COLUMN
    docs_json TEXT  -- JSON object with document paths
);
```

**Example docs_json Value:**
```json
{
  "architecture": "/path/to/ARCHITECTURE_GUIDE.md",
  "phase_plan": "/path/to/PHASE_PLAN.md",
  "checklist": "/path/to/CHECKLIST.md",
  "progress_log": "/path/to/PROGRESS_LOG.md"
}
```

