# ============================================================================
# IMPROVEMENT 1: Reconcile Tool Wiki Page Count
# ============================================================================

improvement_001:
  id: WIKI-IMP-001
  name: "Tool Wiki Page Count Reconciliation"
  priority: P2-MEDIUM
  effort: "30 minutes"

  problem:
    description: "PHASE_PLAN claims 28 tool wiki pages, but wiki/tools/ contains 22 files"
    root_cause: "Tool consolidation during Phase 1 not documented in PHASE_PLAN update"

  proposed_solution:
    approach: "Update PHASE_PLAN.md to reflect actual deliverables"

    steps:
      - step: 1
        action: "Audit wiki/tools/ directory"
        description: "List all 22 markdown files with tool names"
        command: "ls -1 wiki/tools/*.md > wiki/tools/FILE_LIST.txt"

      - step: 2
        action: "Identify tool consolidations"
        description: "Determine which tools were combined into single pages"
        examples:
          - "sentinel_tools.md may cover multiple sentinel functions"
          - "agent_project_utils.md may be utility collection, not single tool"

      - step: 3
        action: "Update PHASE_PLAN.md"
        description: "Correct Phase 1 deliverable count from 28 to 22"
        location: "PHASE_PLAN.md:51"
        change: "28 tool wiki pages → 22 tool wiki pages (consolidated)"

      - step: 4
        action: "Add consolidation note"
        description: "Document why 28 became 22"
        content: |
          Note: Original plan called for 28 individual tool pages, but Phase 1
          consolidated related tools into 22 wiki pages (e.g., sentinel_tools.md
          covers multiple sentinel functions). See wiki/tools/FILE_LIST.txt for
          complete list.

  validation:
    - "PHASE_PLAN.md Phase 1 deliverables section updated"
    - "Consolidation rationale documented"
    - "FILE_LIST.txt created in wiki/tools/"

# ============================================================================
# IMPROVEMENT 2: Create Master Cross-Reference Index
# ============================================================================

improvement_002:
  id: WIKI-IMP-002
  name: "Master Cross-Reference Index"
  priority: P1-HIGH
  effort: "1-2 hours"

  problem:
    description: "No central index linking Phase 1-4 findings to validation results"
    impact: "Hard to trace validation chain (e.g., which Team D findings validate which Phase 1 wiki pages)"

  proposed_solution:
    approach: "Create MASTER_INDEX.md with bi-directional cross-references"
    location: "wiki/MASTER_INDEX.md (new file)"

    structure: |
      # Scribe Systematic Audit Master Index

      ## Quick Navigation
      - [Phase 0: Charter](#phase-0-charter)
      - [Phase 1: Tool Audit](#phase-1-tool-audit)
      - [Phase 2: Storage Layer](#phase-2-storage-layer)
      - [Phase 3: Import Graph](#phase-3-import-graph)
      - [Phase 4: Dead Code & Validation](#phase-4-dead-code--validation)
      - [Implementation Specs](#implementation-specs)
      - [Bug Reports](#bug-reports)

      ## Cross-Reference Tables

      ### Tool Wiki Pages ↔ API Validation
      | Tool | Wiki Page | Team D Validation | LOC | Accuracy |
      |------|-----------|-------------------|-----|----------|
      | append_entry | tools/append_entry.md | API_VALIDATION_REPORT (Finding 1,2,3) | 2,357 | 100% |
      | manage_docs | tools/manage_docs.md | API_VALIDATION_REPORT (Finding 4) | 2,663 | 100% |
      | query_entries | tools/query_entries.md | API_VALIDATION_REPORT (Finding 1) | 2,030 | 100% |
      | ... | ... | ... | ... | ... |

      ### Dead Code ↔ Duplication Overlap
      | Dead Function | Team A Finding | Team B Status | Overlap? |
      |---------------|----------------|---------------|----------|
      | _count_log_entries | orphaned_utilities.md | DUPLICATION-001 | ❌ Different implementations |
      | ... | ... | ... | ... |

    sections:
      - section: phase_summaries
        content: "Links to executive summaries for each phase"

      - section: cross_validation
        content: "Team E validation results with pointers to original findings"

      - section: implementation_roadmap
        content: "YAML specs organized by priority with dependencies"

      - section: bug_catalog
        content: "All bugs discovered across all phases with fix status"

  validation:
    - "MASTER_INDEX.md created in wiki/ directory"
    - "All Phase 1-4 deliverables linked"
    - "Bi-directional cross-references complete"
    - "Cross-validation table shows Team E findings ↔ Teams A-D"

# ============================================================================
# IMPROVEMENT 3: Standardize Research Report Location
# ============================================================================

improvement_003:
  id: WIKI-IMP-003
  name: "Research Report Location Standardization"
  priority: P3-LOW
  effort: "30 minutes"

  problem:
    description: "Team D research report in docs/dev_plans/*/research/, not wiki/analysis/"
    impact: "Inconsistent documentation location conventions"

  proposed_solution:
    approach: "Establish convention: ALL analysis reports go in wiki/analysis/"

    steps:
      - step: 1
        action: "Move Team D report"
        description: "Relocate API_VALIDATION_REPORT to wiki/analysis/"
        command: |
          mv docs/dev_plans/scribe_systematic_audit_1/research/API_VALIDATION_REPORT_20260105_1330.md \
             wiki/analysis/API_VALIDATION_REPORT_20260105_1330.md

      - step: 2
        action: "Update references"
        description: "Fix links in other documents pointing to old location"
        files_to_update:
          - "wiki/INDEX.md"
          - "audit_validation_report.md"
          - "PHASE_PLAN.md"

      - step: 3
        action: "Document convention"
        description: "Add to wiki/README.md or ARCHITECTURE_GUIDE.md"
        content: |
          ## Documentation Conventions

          - **Tool wiki pages**: `wiki/tools/<tool_name>.md`
          - **Analysis reports**: `wiki/analysis/<topic>.md`
          - **Implementation specs**: `wiki/specs/SPEC-<ID>-<name>.yaml`
          - **Bug reports**: `wiki/bugs/BUG-<ID>-<name>.md`
          - **Review reports**: `wiki/review/PHASE_<N>_REVIEW.md`

  validation:
    - "API_VALIDATION_REPORT moved to wiki/analysis/"
    - "All references updated"
    - "Convention documented in wiki/README.md"

