## Testing Strategy

### rotate_log Tests

```python
async def test_rotate_log_readable_mode():
    # Setup test project with log entries
    await set_project(name="rotate_test")
    for i in range(100):
        await append_entry(message=f"Entry {i}", status="info")

    # Perform rotation
    result = await rotate_log(format="readable")

    # Verify readable format
    assert isinstance(result, str)
    assert "╔" in result  # Box drawing
    assert "LOG ROTATION COMPLETE" in result
    assert "rotate_test" in result
    assert "PROGRESS_LOG.md" in result

    # Verify structured mode still works
    result_json = await rotate_log(format="structured")
    assert isinstance(result_json, dict)
    assert result_json["ok"] is True

async def test_rotate_log_token_reduction():
    # Measure token difference
    readable = await rotate_log(format="readable")
    structured = await rotate_log(format="structured")

    readable_tokens = len(readable)  # Approximate
    structured_tokens = len(json.dumps(structured))

    # Readable should be comparable or smaller
    assert readable_tokens <= structured_tokens * 1.2  # Allow 20% overhead
```

