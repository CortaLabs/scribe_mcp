[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scribe-council"
version = "2.5.0"
description = "Optional council template provider for scribe-mcp"
requires-python = ">=3.11"
license = { text = "See repository LICENSE" }
authors = [{ name = "Scribe MCP Contributors" }]
dependencies = ["scribe-mcp==2.4.0"]

[project.entry-points."council.templates"]
scribe-council = "scribe_council.council_templates:get_council_templates"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["scribe_council*"]

[tool.setuptools.package-data]
"scribe_council" = [
  "council_templates/skills/*",
  "council_templates/skills/**/*",
]
