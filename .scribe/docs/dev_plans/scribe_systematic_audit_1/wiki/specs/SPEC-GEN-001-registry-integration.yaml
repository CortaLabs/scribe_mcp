# SPEC-GEN-001: ProjectRegistry Integration for Template Baseline Tracking

## Problem Statement

`generate_doc_templates.py` creates documentation templates but does **NOT** call `ProjectRegistry.record_doc_update()` to record baseline hashes. This causes BUG-001 in `set_project.py`, which cannot distinguish between:
- **Pristine templates** (newly created, never modified) → should show "NEW PROJECT CREATED"
- **Modified documents** (templates that have been worked on) → should show "PROJECT ACTIVATED"

The infrastructure exists but is not wired up. This spec defines the exact integration required.

