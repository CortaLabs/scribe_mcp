### Initiative 5: Implement Search Scope Strategies

**Objective**: Replace if-elif scope routing with strategy pattern.

**Current State**:
- Scope routing via if-elif (lines 1271-1341)
- Each scope branch duplicates project iteration

**Target State**:
```python
# New file: scribe_mcp/utils/search_scopes.py

from abc import ABC, abstractmethod
from typing import List, Dict, Optional

class SearchScope(ABC):
    """Base class for search scope strategies."""

    @abstractmethod
    async def resolve_projects(self, state) -> List[Dict]:
        """Return list of projects to search."""
        pass


class ProjectScope(SearchScope):
    """Search current project only."""

    def __init__(self, project_context):
        self.project_context = project_context

    async def resolve_projects(self, state) -> List[Dict]:
        return [self.project_context.project]


class GlobalScope(SearchScope):
    """Search global log only."""

    async def resolve_projects(self, state) -> List[Dict]:
        return [{
            "name": "global",
            "progress_log": "docs/GLOBAL_PROGRESS_LOG.md",
            "docs_dir": "docs",
            "root": "."
        }]


class AllProjectsScope(SearchScope):
    """Search all configured projects."""

    async def resolve_projects(self, state) -> List[Dict]:
        return await _load_all_projects(state)


class DocumentFilteredScope(SearchScope):
    """Search projects with specific document types."""

    def __init__(self, document_types: Optional[List[str]]):
        self.document_types = document_types

    async def resolve_projects(self, state) -> List[Dict]:
        projects = await _load_all_projects(state)
        filtered = [
            p for p in projects
            if _project_has_document_types(p, self.document_types, "research")
        ]
        # Always include global for filtered scopes
        filtered.append(GlobalScope().resolve_projects(state)[0])
        return filtered


class SearchScopeFactory:
    """Factory for creating search scope strategies."""

    @staticmethod
    def create(scope: str, document_types: Optional[List[str]], project_context) -> SearchScope:
        if scope == "project":
            return ProjectScope(project_context)
        elif scope == "global":
            return GlobalScope()
        elif scope == "all_projects":
            return AllProjectsScope()
        elif scope in ["research", "bugs", "all"]:
            return DocumentFilteredScope(document_types)
        else:
            raise ValueError(f"Unknown search scope: {scope}")


# Usage in query_entries:
scope_strategy = SearchScopeFactory.create(search_scope, document_types, context)
projects = await scope_strategy.resolve_projects(state)
```

**Impact**:
- **Lines Reorganized**: 70 (scope routing → 4 strategy classes)
- **Lines Added**: 80 (new search_scopes.py)
- **Net**: +10 LOC (but cleaner separation)
- **Extensibility**: New scope = new strategy class
- **Testability**: Each scope testable independently

