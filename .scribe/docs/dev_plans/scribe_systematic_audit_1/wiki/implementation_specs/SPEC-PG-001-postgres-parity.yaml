## 1. Problem Statement

PostgreSQL backend is 85% incomplete, missing 10 tables and 1 critical method compared to SQLite. This prevents full feature availability in PostgreSQL mode and creates a maintenance burden.

### Impact Assessment

**Current State**:
- 13/23 tables implemented (57%)
- 16/17 abstract methods implemented (94%)
- No Document Management 2.0 support
- Broken reminder system (no cooldown persistence)
- No tool usage analytics
- No agent performance tracking

**Affected Systems**:
- manage_docs tool (document caching)
- Reminder engine (cooldown tracking)
- Review agent (grade persistence)
- Tool logger (usage analytics)
- Session management (partial)

---

## 2. Scope

### In Scope

1. Implement 10 missing tables in `db/init.sql`
2. Implement `delete_project()` in `db/ops.py`
3. Add 12+ missing indexes
4. Convert FTS5 to PostgreSQL tsvector
5. Update all affected tools to use PostgreSQL-compatible queries
6. Add comprehensive test coverage

### Out of Scope

- Performance optimization beyond parity
- New features not in SQLite
- Migration tooling from SQLite to PostgreSQL
- Backward compatibility with old PostgreSQL schemas

