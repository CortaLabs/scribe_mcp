## Tool-by-Tool Specifications

### Category 1: Full Format Support (13 tools)

**Tools**: append_entry, list_projects, get_project, read_recent, query_entries, set_project, read_file, manage_docs, generate_doc_templates, append_event, open_bug, open_security, link_fix

**Format Modes**:
- ✅ `readable` - Human-readable with boxes/colors
- ✅ `structured` - Full JSON
- ✅ `compact` - Abbreviated JSON (NEW - must implement)

**Default Format**: `readable` (user-facing tools)

---

### Category 2: JSON-Only Tools (2 tools)

**Tools**: scribe_doctor, delete_project

**Format Modes**:
- ❌ `readable` - NOT SUPPORTED (by design)
- ✅ `structured` - Full JSON (only mode)
- ❌ `compact` - NOT SUPPORTED (single mode tools)

**Behavior**: Ignore format parameter, always return structured JSON

**Rationale**: Operational/diagnostic tools where formatting adds no value

**Implementation**:
```python
async def scribe_doctor(**kwargs):
    # Ignore format parameter
    diagnostics = _run_diagnostics()
    return {"ok": True, "diagnostics": diagnostics}
```

---

### Category 3: Special Case (rotate_log)

**Current**: Returns JSON for ALL format modes (BUG-FORMAT-004)

**Target**:
- ✅ `readable` - NEW - Box-formatted summary
- ✅ `structured` - Full JSON (existing)
- ✅ `compact` - Abbreviated JSON (NEW)

**Readable Mode Example**:
```
╔══════════════════════════════════════════════════════════╗
║ LOG ROTATION COMPLETE                                    ║
╟──────────────────────────────────────────────────────────╢
║ Project: my_project                                      ║
║ Original: PROGRESS_LOG.md (15,234 bytes)                 ║
║ Archived: PROGRESS_LOG.md.20260105_120000.md             ║
║ New log: PROGRESS_LOG.md (empty)                         ║
║ Status: Success                                          ║
╚══════════════════════════════════════════════════════════╝
```

**Estimated Reduction**: 40-50% vs structured mode

