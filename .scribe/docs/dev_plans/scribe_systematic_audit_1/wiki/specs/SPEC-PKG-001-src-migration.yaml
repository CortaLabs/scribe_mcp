          estimated_effort_minutes: 30
          special_action: "Remove/update sys.path bootstrap (lines 16-18)"
          notes: "Main MCP server entry point - critical file"

        - name: "__init__.py"
          type: package_init
          import_changes: 0
          estimated_effort_minutes: 5
          notes: "Package version and metadata"

        - name: "reminders.py"
          type: module
          import_changes: estimated_8_to_12
          estimated_effort_minutes: 20

        - name: "debug_append_entry.py"
          action: "DELETE (temporary debug file identified by Team A)"
          estimated_effort_minutes: 5

      subtotal_effort_minutes: 60
      subtotal_effort_hours: 1.00

    demo_files:
      file_count: 1
      current_location: "demo/"
      new_location: "demo/ (stays at root - not installed)"
      migration_complexity: low
      files:
        - name: "demo/demo_global_scribe.py"
          action: "Update imports to use installed package"
          import_changes: estimated_5_to_8
          estimated_effort_minutes: 10
          special_action: "Remove sys.path.insert (line 14)"

      subtotal_effort_minutes: 10
      subtotal_effort_hours: 0.17

    test_files:
      file_count: 97
      current_location: "tests/"
      new_location: "tests/ (stays at root)"
      migration_complexity: high  # All tests need sys.path removal
      bulk_action: |
        All 97 test files require:
        1. Remove sys.path.insert/append lines (lines vary per file)
        2. Update imports to use installed package (minimal changes)
        3. Verify pytest still discovers tests
        4. Check for any Path(__file__) assumptions

      systematic_changes:
        - action: "Remove sys.path.insert(0, str(Path(__file__).parent.parent))"
          files_affected: 65
          pattern: "Lines 8-16 typically"
          estimated_effort_per_file_minutes: 3

        - action: "Remove sys.path.insert(0, str(Path(__file__).parent.parent.parent))"
          files_affected: 5
          pattern: "Nested test utilities"
          estimated_effort_per_file_minutes: 5

        - action: "Update conftest.py sys.path removal"
          files_affected: 1
          estimated_effort_minutes: 10
          special: "Remove parents[2] pattern"

        - action: "Standardize remaining test imports"
          files_affected: 97
          estimated_effort_per_file_minutes: 2

      representative_files:
        - name: "tests/conftest.py"
          special_handling: true
          changes:
            - "Remove ROOT = Path(__file__).resolve().parents[2]"
            - "Remove sys.path.insert(0, str(ROOT))"
          estimated_effort_minutes: 15

        - name: "tests/test_sandbox_bypass.py"
          special_handling: true
          changes:
            - "Remove sys.path.insert(0, '.')  # Anomaly from Team A"
          estimated_effort_minutes: 5

        - name: "tests/test_tool_logger.py"
          changes:
            - "Remove sys.path.insert with parent.parent.parent"
          estimated_effort_minutes: 5

        - name: "tests/test_performance.py"
          changes:
            - "Remove project_root variable and sys.path.insert"
          estimated_effort_minutes: 5

        - name: "tests/test_db_activation.py"
          changes:
            - "Remove Path as P alias pattern"
            - "Remove sys.path.insert"
          estimated_effort_minutes: 5

      # Bulk calculation for 97 tests
      subtotal_effort_minutes: 485  # (65*3) + (5*5) + 10 + (97*2) + special cases
      subtotal_effort_hours: 8.08
      notes: |
        Largest migration effort due to volume.
        Can be partially automated with find/replace patterns.
        High risk of breaking test discovery if done incorrectly.

# ============================================================================
# SECTION 3: TOTAL EFFORT BREAKDOWN
# ============================================================================

effort_breakdown:
  by_category:
    tools_module: 340 minutes  # 5.67 hours
    utils_module: 320 minutes  # 5.33 hours
    doc_management: 160 minutes  # 2.67 hours
    scripts_module: 175 minutes  # 2.92 hours (Option A)
    shared_module: 80 minutes   # 1.33 hours
    storage_module: 65 minutes  # 1.08 hours
    state_module: 50 minutes    # 0.83 hours
    config_module: 45 minutes   # 0.75 hours
    template_engine: 40 minutes # 0.67 hours
    db_module: 35 minutes       # 0.58 hours
    plugins_module: 35 minutes  # 0.58 hours
    security_module: 15 minutes # 0.25 hours
    templates_module: 5 minutes # 0.08 hours
    root_files: 60 minutes      # 1.00 hours
    demo_files: 10 minutes      # 0.17 hours
    test_files: 485 minutes     # 8.08 hours

  production_code_total:
    minutes: 1435
    hours: 23.92

  test_code_total:
    minutes: 485
    hours: 8.08

  grand_total:
    minutes: 1920
    hours: 32.00

  confidence_adjusted_estimates:
    optimistic_multiplier: 0.7
    realistic_multiplier: 1.0
    pessimistic_multiplier: 1.5

    optimistic_hours: 22.4   # 32 * 0.7
    realistic_hours: 32.0    # Base estimate
    pessimistic_hours: 48.0  # 32 * 1.5

  assumptions:
    - "Team B import graph not yet available - used estimated import counts"
    - "No circular dependencies discovered yet (Team D pending)"
    - "Assumes Option A for scripts (console_scripts)"
    - "Assumes semi-automated test file updates (find/replace patterns)"
    - "Includes setup.py/pyproject.toml creation time"
    - "Includes testing and validation time"

  excluded_from_estimates:
    - "CI/CD pipeline updates"
    - "Documentation updates beyond code comments"
    - "Debugging time if circular dependencies found"
    - "Rollback time if migration fails"

# ============================================================================
# SECTION 4: IMPORT PATTERN CHANGES
# ============================================================================

import_patterns:
  current_patterns:
    absolute_imports: "from scribe_mcp.tools.X import Y"
    relative_imports: "from .utils import something"
    test_imports: "sys.path.insert() + from scribe_mcp.X import Y"
    script_imports: "sys.path.insert() + from scribe_mcp.X import Y"

  after_migration:
    production_code: "UNCHANGED - from scribe_mcp.tools.X import Y"
    test_code: "UNCHANGED - from scribe_mcp.tools.X import Y (but remove sys.path)"
    script_code_option_a: "Entry points handle imports automatically"
    script_code_option_b: "UNCHANGED (if scripts stay at root with sys.path)"

  key_insight: |
    Because package name stays "scribe_mcp", absolute imports DON'T CHANGE.
    Only file LOCATIONS change (into src/), not import statements.
    This dramatically reduces migration risk.

  exceptions:
    - name: "Relative imports within modules"
      impact: "May need adjustment if module structure changes"
      likelihood: "Low - module structure unchanged"

    - name: "Test fixtures and conftest.py"
      impact: "May need path adjustments for test data files"
      likelihood: "Medium - verify fixture file paths"

    - name: "Template file loading"
      impact: "templates/ directory paths may need updating"
      likelihood: "Medium - check template_engine/engine.py"

# ============================================================================
# SECTION 5: PACKAGING REQUIREMENTS
# ============================================================================

packaging_requirements:
  pyproject_toml:
    purpose: "Modern Python packaging (PEP 517/518)"
    required_sections:
      - build_system
      - project_metadata
      - optional_dependencies
      - entry_points

    content_outline: |
      [build-system]
      requires = ["setuptools>=61.0", "wheel"]
      build-backend = "setuptools.build_meta"

      [project]
      name = "scribe-mcp"
      version = "2.1.1"  # Or dynamic from __version__.py
      description = "Enterprise-grade documentation governance for AI-powered development"
      authors = [{name = "Author Name", email = "author@example.com"}]
      requires-python = ">=3.10"
      dependencies = [
        # From requirements.txt
        "mcp>=0.1.0",
        # ... all other dependencies
      ]

      [project.optional-dependencies]
      dev = ["pytest", "ruff", "mypy"]
      postgres = ["asyncpg", "psycopg2-binary"]
      vector = ["faiss-cpu", "sentence-transformers"]

      [project.scripts]  # Console script entry points
      scribe = "scribe_mcp.scripts.scribe:main"
      scribe-cli = "scribe_mcp.scripts.scribe_cli:main"
      scribe-probe = "scribe_mcp.scripts.scribe_probe:main"
      migrate-scribe-db = "scribe_mcp.scripts.migrate_database:main"
      reindex-scribe-docs = "scribe_mcp.scripts.reindex_docs:main"
      reindex-scribe-vector = "scribe_mcp.scripts.reindex_vector:main"
      check-scribe-vector = "scribe_mcp.scripts.check_vector_index:main"

      [tool.setuptools.packages.find]
      where = ["src"]

  setup_py:
    purpose: "Fallback for older pip versions"
    required: false
    recommended: true
    content_outline: |
      from setuptools import setup, find_packages

      setup(
          name="scribe-mcp",
          version="2.1.1",
          package_dir={"": "src"},
          packages=find_packages(where="src"),
          install_requires=[...],
          extras_require={...},
          entry_points={...},
      )

  manifest_in:
    purpose: "Include non-Python files in distribution"
    required: true
    content_outline: |
      include README.md
      include LICENSE
      include requirements.txt
      recursive-include src/scribe_mcp/templates *
      recursive-include src/scribe_mcp/config *.yaml *.json
      exclude tests/*
      exclude .scribe/*
      exclude scripts/*

  version_file:
    location: "src/scribe_mcp/__version__.py"
    purpose: "Single source of truth for version number"
    content: |
      __version__ = "2.1.1"
      __version_info__ = (2, 1, 1)

  installation_methods:
    development:
      command: "pip install -e ."
      description: "Editable install - changes reflected immediately"
      use_case: "Development and testing"

    production:
      command: "pip install ."
      description: "Regular install from source"
      use_case: "Production deployment"

    from_pypi:
      command: "pip install scribe-mcp"
      description: "Install from PyPI (future)"
      use_case: "End users"

# ============================================================================
# SECTION 6: MIGRATION PHASES
# ============================================================================

migration_phases:
  can_be_incremental: false
  rationale: |
    Migration MUST be all-at-once because:
    1. Package structure change affects ALL imports simultaneously
    2. Can't have files in both old and new locations (import ambiguity)
    3. Tests depend on consistent import behavior
    4. No graceful hybrid state exists

  phase_breakdown:
    phase_0_preparation:
      name: "Pre-Migration Setup"
      duration_hours: 2
      tasks:
        - task: "Create feature branch"
          effort_minutes: 5

        - task: "Backup current state"
          effort_minutes: 10

        - task: "Review Team B import graph (when available)"
          effort_minutes: 30

        - task: "Review Team D circular dependencies (when available)"
          effort_minutes: 30

        - task: "Create migration checklist"
          effort_minutes: 20

        - task: "Set up testing environment"
          effort_minutes: 15

        - task: "Document rollback procedure"
          effort_minutes: 30

      deliverables:
        - "Migration branch: feature/src-layout-migration"
        - "Backup tag: pre-src-migration"
        - "Detailed task checklist"
        - "Rollback script ready"

    phase_1_directory_creation:
      name: "Create src/ Structure"
      duration_hours: 1
      tasks:
        - task: "Create src/scribe_mcp/ directory"
          command: "mkdir -p src/scribe_mcp"
          effort_minutes: 2

        - task: "Move all production modules to src/scribe_mcp/"
          commands:
            - "mv tools src/scribe_mcp/"
            - "mv utils src/scribe_mcp/"
            - "mv storage src/scribe_mcp/"
            - "mv config src/scribe_mcp/"
            - "mv state src/scribe_mcp/"
            - "mv db src/scribe_mcp/"
            - "mv plugins src/scribe_mcp/"
            - "mv shared src/scribe_mcp/"
            - "mv template_engine src/scribe_mcp/"
            - "mv security src/scribe_mcp/"
            - "mv doc_management src/scribe_mcp/"
            - "mv templates src/scribe_mcp/"
          effort_minutes: 10

        - task: "Move root Python files to src/scribe_mcp/"
          commands:
            - "mv server.py src/scribe_mcp/"
            - "mv __init__.py src/scribe_mcp/"
            - "mv reminders.py src/scribe_mcp/"
          effort_minutes: 5

        - task: "Delete debug_append_entry.py"
          command: "rm debug_append_entry.py"
          effort_minutes: 2

        - task: "Create __version__.py"
          effort_minutes: 5

      verification:
        - "Verify all modules in src/scribe_mcp/"
        - "Verify tests/ still at root"
        - "Verify scripts/ decision made"
        - "Verify demo/ still at root"

    phase_2_packaging_files:
      name: "Create Packaging Configuration"
      duration_hours: 2
      tasks:
        - task: "Create pyproject.toml"
          effort_minutes: 45
          template_required: true

        - task: "Create setup.py (optional)"
          effort_minutes: 30

        - task: "Create MANIFEST.in"
          effort_minutes: 15

        - task: "Update requirements.txt if needed"
          effort_minutes: 10

        - task: "Create __version__.py"
          effort_minutes: 5

        - task: "Update __init__.py with version import"
          effort_minutes: 5

      deliverables:
        - "pyproject.toml (complete)"
        - "setup.py (optional)"
        - "MANIFEST.in"
        - "src/scribe_mcp/__version__.py"

    phase_3_production_code_updates:
      name: "Update Production Code"
      duration_hours: 16
      tasks:
        - task: "Remove sys.path hacks from production code"
          files:
            - "server.py (lines 16-18)"
            - "utils/tool_logger.py (line 171)"
            - "template_engine/cli.py (line 10)"
          effort_minutes: 30

        - task: "Update server.py imports"
          effort_minutes: 30
          notes: "Verify MCP server still starts"

        - task: "Update all tool module imports"
          file_count: 28
          estimated_effort: 340 minutes
          notes: "Likely minimal changes but verify each"

        - task: "Update utils module imports"
          file_count: 25
          estimated_effort: 320 minutes

        - task: "Update remaining module imports"
          modules:
            - doc_management
            - scripts
            - shared
            - storage
            - state
            - config
            - template_engine
            - db
            - plugins
            - security
            - templates
          estimated_effort: 475 minutes

      verification:
        - "Run: python -m src.scribe_mcp.server (test startup)"
        - "Check all imports resolve"
        - "No relative import errors"

    phase_4_test_updates:
      name: "Update All Test Files"
      duration_hours: 8
      tasks:
        - task: "Update conftest.py"
          effort_minutes: 15
          changes:
            - "Remove ROOT variable"
            - "Remove sys.path.insert"
            - "Verify pytest fixtures still work"

        - task: "Bulk update standard test files (65 files)"
          pattern: "Remove sys.path.insert(0, str(Path(__file__).parent.parent))"
          effort_minutes: 195  # 65 * 3
          automation_possible: true

        - task: "Update nested test files (5 files)"
          pattern: "Remove parent.parent.parent pattern"
          effort_minutes: 25  # 5 * 5

        - task: "Fix test_sandbox_bypass.py anomaly"
          effort_minutes: 5

        - task: "Verify all test imports"
          effort_minutes: 194  # 97 * 2

        - task: "Update test data file paths if needed"
          effort_minutes: 30

      verification:
        - "Run: pytest --collect-only (verify test discovery)"
        - "Run: pytest -x (fail fast to catch import errors)"
        - "Fix any Path(__file__) assumptions"

    phase_5_script_migration:
      name: "Migrate Scripts (Option A: console_scripts)"
      duration_hours: 3
      tasks:
        - task: "Refactor scripts to have main() entry points"
          scripts:
            - scripts/scribe.py
            - scripts/scribe_cli.py
            - scripts/scribe_probe.py
            - scripts/migrate_database.py
            - scripts/reindex_docs.py
            - scripts/reindex_vector.py
            - scripts/check_vector_index.py
          effort_minutes: 140
          notes: "Each script needs if __name__ == '__main__': main() pattern"

        - task: "Remove sys.path hacks from scripts"
          effort_minutes: 20

        - task: "Verify entry points in pyproject.toml"
          effort_minutes: 15

      verification:
        - "Install package: pip install -e ."
        - "Test each console script command"
        - "Verify scripts work without manual sys.path"

    phase_6_installation_testing:
      name: "Installation and Integration Testing"
      duration_hours: 3
      tasks:
        - task: "Create fresh venv"
          effort_minutes: 5

        - task: "Install editable package"
          command: "pip install -e ."
          effort_minutes: 5

        - task: "Run full test suite"
          command: "pytest"
          effort_minutes: 60
          expected_outcome: "All tests pass"

        - task: "Test MCP server startup"
          command: "python -m scribe_mcp.server"
          effort_minutes: 10

        - task: "Test all console script commands"
          effort_minutes: 30

        - task: "Verify import from external script"
          test: "from scribe_mcp.tools.append_entry import append_entry"
          effort_minutes: 10

        - task: "Check for any remaining sys.path usage"
          command: "rg 'sys.path.insert|sys.path.append' --type py"
          effort_minutes: 10
          expected_outcome: "Zero occurrences in production code"

        - task: "Test package in clean environment"
          effort_minutes: 30
          notes: "Separate venv to verify dependencies"

      deliverables:
        - "All tests passing"
        - "Server starts successfully"
        - "Console scripts functional"
        - "No remaining sys.path hacks"

    phase_7_documentation:
      name: "Update Documentation"
      duration_hours: 2
      tasks:
        - task: "Update CLAUDE.md import examples"
          effort_minutes: 30

        - task: "Update README.md installation instructions"
          effort_minutes: 30

        - task: "Update developer documentation"
          effort_minutes: 30

        - task: "Create MIGRATION_NOTES.md"
          effort_minutes: 30

      deliverables:
        - "Updated CLAUDE.md"
        - "Updated README.md"
        - "MIGRATION_NOTES.md"

# ============================================================================
# SECTION 7: RISK ANALYSIS AND MITIGATION
# ============================================================================

risks:
  risk_1_breaking_tests:
    description: "Test discovery breaks after migration"
    likelihood: medium
    impact: high
    severity_score: 0.7

    root_causes:
      - "pytest can't find tests in new structure"
      - "Test fixtures break due to path changes"
      - "conftest.py sys.path removal causes import errors"

    mitigation_strategy:
      - action: "Test pytest collection BEFORE full migration"
        command: "pytest --collect-only"

      - action: "Keep pytest.ini or pyproject.toml [tool.pytest.ini_options]"
        config: |
          [tool.pytest.ini_options]
          testpaths = ["tests"]
          python_files = ["test_*.py"]

      - action: "Verify conftest.py changes independently"

    rollback_trigger: "If >5% of tests fail discovery"

  risk_2_circular_import_exposure:
    description: "Migration exposes hidden circular dependencies"
    likelihood: low_to_medium
    impact: high
    severity_score: 0.5

    root_causes:
      - "Lazy imports that relied on sys.path quirks"
      - "Circular dependencies masked by import order"
      - "Team D hasn't completed analysis yet"

    mitigation_strategy:
      - action: "Wait for Team D circular dependency report"
        priority: high

      - action: "Test imports in isolation"
        command: "python -c 'import scribe_mcp'"

      - action: "Use importlib to detect cycles"

    rollback_trigger: "If unresolvable circular imports found"
    contingency: "May need lazy imports or refactoring"

  risk_3_missing_package_data:
    description: "Template files or config not included in package"
    likelihood: medium
    impact: medium
    severity_score: 0.5

    root_causes:
      - "MANIFEST.in incomplete"
      - "setup.py package_data missing"
      - "Templates in templates/ not copied"

    mitigation_strategy:
      - action: "Audit all non-Python files"
        directories:
          - templates/
          - config/

      - action: "Test package installation in clean venv"

      - action: "Verify template loading in tests"

    rollback_trigger: "If templates can't be loaded after install"

  risk_4_script_entry_points_fail:
    description: "Console scripts don't work after migration"
    likelihood: low
    impact: medium
    severity_score: 0.3

    root_causes:
      - "Entry point paths incorrect in pyproject.toml"
      - "Scripts lack main() function"
      - "Script dependencies not installed"

    mitigation_strategy:
      - action: "Test each entry point individually"

      - action: "Verify main() functions exist"

      - action: "Keep Option B as fallback (scripts at root)"

    rollback_trigger: "If >2 scripts fail"
    contingency: "Revert to scripts/ with sys.path (Option B)"

  risk_5_import_path_hardcoding:
    description: "Code has hardcoded paths that break"
    likelihood: medium
    impact: medium
    severity_score: 0.5

    root_causes:
      - "Path(__file__).parent assumptions"
      - "Hardcoded relative paths to config/templates"
      - "Working directory assumptions"

    mitigation_strategy:
      - action: "Grep for Path(__file__) usage"
        command: "rg 'Path\\(__file__\\)' --type py"

      - action: "Audit template_engine for path dependencies"

      - action: "Test from different working directories"

    rollback_trigger: "If path errors in >3 modules"

  risk_6_development_workflow_disruption:
    description: "Developers can't work during migration"
    likelihood: high
    impact: low
    severity_score: 0.4

    root_causes:
      - "Migration takes 32+ hours"
      - "All-at-once approach blocks progress"
      - "Testing period requires stable code"

    mitigation_strategy:
      - action: "Perform migration in feature branch"
        branch: "feature/src-layout-migration"

      - action: "Don't merge until fully tested"

      - action: "Communicate migration timeline to team"

      - action: "Complete migration in dedicated time block"

    rollback_trigger: "N/A - workflow risk, not technical"

  risk_7_pypi_name_conflict:
    description: "Package name 'scribe-mcp' already taken on PyPI"
    likelihood: unknown
    impact: low
    severity_score: 0.3

    root_causes:
      - "Didn't check PyPI before naming"

    mitigation_strategy:
      - action: "Check PyPI name availability"
        command: "pip search scribe-mcp"

      - action: "Have backup names ready"
        alternatives:
          - "scribe-mcp-server"
          - "mcp-scribe"
          - "scribe-protocol"

    rollback_trigger: "N/A - rename if needed"

# ============================================================================
# SECTION 8: ROLLBACK PLAN
# ============================================================================

rollback_plan:
  scenario: "Migration fails after Phase 3-6"
  complexity: high
  estimated_rollback_time: 2-4 hours

  prerequisites:
    - "Git branch: feature/src-layout-migration"
    - "Git tag: pre-src-migration (before migration start)"
    - "Backup of current state"

  rollback_procedure:
    step_1:
      action: "Stash or commit current broken state"
      command: "git add -A && git commit -m 'WIP: failed migration state'"

    step_2:
      action: "Return to pre-migration state"
      command: "git checkout pre-src-migration"

    step_3:
      action: "Create rollback branch"
      command: "git checkout -b rollback/src-migration-failed"

    step_4:
      action: "Verify original code works"
      commands:
        - "pytest"
        - "python server.py"

    step_5:
      action: "Document failure reasons"
      deliverable: "ROLLBACK_REPORT.md"

    step_6:
      action: "Merge rollback branch to main if needed"

  cannot_rollback_after:
    - "PyPI package published"
    - "Production deployment completed"
    - "Database migrations run"

  partial_rollback_impossible:
    reason: "All-or-nothing migration - can't have hybrid state"

# ============================================================================
# SECTION 9: TESTING STRATEGY
# ============================================================================

testing_strategy:
  test_phases:
    unit_tests:
      scope: "All 97 test files"
      command: "pytest tests/"
      expected_result: "100% pass rate"
      estimated_duration: 10-15 minutes

    integration_tests:
      scope: "Full MCP server workflow"
      test_cases:
        - "Server startup and shutdown"
        - "Tool invocation via MCP protocol"
        - "Database operations"
        - "File operations"
        - "Template rendering"
      estimated_duration: 30 minutes

    import_tests:
      scope: "Verify all imports resolve"
      test_script: |
        # test_imports.py
        import scribe_mcp
        from scribe_mcp import server
        from scribe_mcp.tools import append_entry
        from scribe_mcp.storage import sqlite
        # ... etc for all major modules
      estimated_duration: 5 minutes

    console_script_tests:
      scope: "All entry points functional"
      commands:
        - "scribe --help"
        - "scribe-cli --version"
        - "scribe-probe --help"
      estimated_duration: 15 minutes

    clean_install_test:
      scope: "Package installs in fresh environment"
      procedure:
        - "Create new venv"
        - "pip install -e ."
        - "Run all tests"
        - "Verify no sys.path required"
      estimated_duration: 20 minutes

  test_coverage_requirements:
    unit_test_coverage: ">90%"
    integration_test_coverage: "All critical paths"

  test_automation:
