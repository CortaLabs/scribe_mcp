### Phase 4: Update Project Resolution Query

**File:** `shared/logging_utils.py`

**Current Code (lines 110-119):**
```python
row = conn.execute(
    "SELECT name, repo_root, progress_log_path FROM scribe_projects WHERE name = ?",
    (project_name,)
).fetchone()
if row:
    session_project = {
        "name": row["name"],
        "root": row["repo_root"],
        "progress_log": row["progress_log_path"],
    }
```

**Fixed Code:**
```python
import json

row = conn.execute(
    # ADD docs_json to SELECT statement
    "SELECT name, repo_root, progress_log_path, docs_json FROM scribe_projects WHERE name = ?",
    (project_name,)
).fetchone()
if row:
    session_project = {
        "name": row["name"],
        "root": row["repo_root"],
        "progress_log": row["progress_log_path"],
    }

    # Parse and add docs field if present
    if row["docs_json"]:
        try:
            session_project["docs"] = json.loads(row["docs_json"])
        except (json.JSONDecodeError, TypeError) as e:
            # Log error but continue with partial project data
            # Fallback to state.json will still work
            pass
```

**Additional Considerations:**
- Handle NULL docs_json gracefully (new projects might not have it yet)
- Catch JSON parse errors
- Consider logging when docs_json is missing/invalid for debugging

