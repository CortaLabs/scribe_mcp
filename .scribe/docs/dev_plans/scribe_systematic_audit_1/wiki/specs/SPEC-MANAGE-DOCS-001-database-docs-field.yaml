## Rollback Plan

If implementation fails or causes issues:

1. **Remove Column (Schema Rollback)**
   ```sql
   -- SQLite doesn't support DROP COLUMN directly
   -- Must recreate table without docs_json

   BEGIN TRANSACTION;

   -- Create new table without docs_json
   CREATE TABLE scribe_projects_backup AS
   SELECT id, name, repo_root, progress_log_path, created_at, updated_at,
          status, phase, confidence, completed_at, last_activity, description,
          last_entry_at, last_access_at, last_status_change, tags, meta
   FROM scribe_projects;

   -- Drop original
   DROP TABLE scribe_projects;

   -- Rename backup
   ALTER TABLE scribe_projects_backup RENAME TO scribe_projects;

   COMMIT;
   ```

2. **Revert Code Changes**
   - Git revert logging_utils.py changes
   - Git revert set_project.py changes
   - Git revert storage backend changes

3. **Fallback to state.json**
   - Projects will continue using state.json for docs mapping
   - manage_docs actions remain broken but no worse than before

