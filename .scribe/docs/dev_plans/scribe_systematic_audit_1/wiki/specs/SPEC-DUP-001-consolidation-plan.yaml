        description: "New module for project metadata gathering utilities"
        estimated_loc: 100

      - step: 3
        action: "Implement gather_project_inventory()"
        description: "Consolidate logic from 3 implementations"
        uses_utilities:
          - "utils.files.count_file_lines()"
          - "utils.files.detect_custom_project_content()"
          - "utils.logs.count_log_entries()"

      - step: 4
        action: "Update tools/set_project.py"
        description: "Replace _gather_project_inventory() with shared function"
        lines_affected: [61-127, 522]
        loc_removed: 67
        loc_added: 2

      - step: 5
        action: "Update tools/list_projects.py"
        description: "Replace _gather_doc_info() with shared function"
        lines_affected: [50-128, 197]
        loc_removed: 79
        loc_added: 2

      - step: 6
        action: "Update tools/get_project.py"
        description: "Replace _gather_doc_info() with shared function (fixes missing custom content)"
        lines_affected: [130-179, 245]
        loc_removed: 50
        loc_added: 2

      - step: 7
        action: "Add comprehensive tests"
        description: "Test gather_project_inventory() with various project states"
        test_file: tests/test_project_metadata.py
        test_cases:
