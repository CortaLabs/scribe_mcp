# ============================================================================
# PHASE 6A: Infrastructure Setup (PREREQUISITE)
# ============================================================================

phase_6a_infrastructure:
  title: "Package Structure Modernization"
  depends_on:
    - SPEC-PKG-001  # Phase 3 src/ migration spec
  blocking_for:
    - sys_path_removal
  estimated_effort: "3-4 hours"

  tasks:
    create_pyproject_toml:
      priority: CRITICAL
      description: "Create pyproject.toml with editable install support"
      files_created:
        - pyproject.toml
      content:
        build_system:
          requires: ["setuptools>=61.0", "wheel"]
          build-backend: "setuptools.build_meta"
        project:
          name: "scribe-mcp"
          version: "2.1.1"
          requires_python: ">=3.8"
          dependencies:
            - "asyncio"
            - "pathlib"
            - "jinja2>=3.0"
          optional_dependencies:
            vector:
              - "faiss-cpu"
              - "sentence-transformers"
              - "numpy"
            tokens:
              - "tiktoken"
            monitoring:
              - "psutil"
              - "watchdog"

    verify_editable_install:
      priority: CRITICAL
      description: "Test pip install -e . works"
      commands:
        - "cd /home/austin/projects/MCP_SPINE/scribe_mcp"
        - "pip install -e ."
        - "python -c 'import scribe_mcp; print(scribe_mcp.__file__)'"
      expected_output: "Should print package location"

    update_development_docs:
      priority: HIGH
      description: "Update CLAUDE.md and README with new install process"
      files_modified:
        - CLAUDE.md
        - README.md
      changes:
        - "Replace sys.path instructions with 'pip install -e .'"
        - "Update test running instructions"
        - "Update script invocation patterns"

# ============================================================================
# PHASE 6B: sys.path Removal from Tests (60 files)
# ============================================================================

phase_6b_test_sys_path_removal:
  title: "Remove sys.path Hacks from Test Files"
  depends_on:
    - phase_6a_infrastructure.verify_editable_install
  estimated_effort: "2-3 hours"
  files_modified: 60
  pattern: "sys.path.insert(0, str(Path(__file__).parent.parent))"

  affected_files:
    # Sample - full list in legacy_patterns_catalog.md
    - tests/test_health_check.py:10
    - tests/conftest.py:7
    - tests/test_conflict_scenarios.py:10
    - tests/test_tools.py:16
    - tests/test_get_project_integration.py:8
    # ... 55 more test files

  removal_strategy:
    approach: "Automated search and replace"
    validation: "Run full pytest suite after each batch"
    rollback_plan: "Git revert if tests fail"

  commands:
    find_all_test_sys_path:
      - "grep -r 'sys.path.insert' tests/ --include='*.py' -l"

    automated_removal:
      description: "Remove sys.path.insert lines from all test files"
      script: |
        for file in tests/test_*.py tests/conftest.py; do
          sed -i '/^sys.path.insert(0/d' "$file"
          # Also remove Path import if only used for sys.path
          # Manual review recommended
        done

    validation:
      - "pytest -v"  # Full test suite
      - "pytest tests/test_health_check.py -v"  # Spot check

  acceptance_criteria:
    - "All 60 test files have sys.path.insert lines removed"
    - "pytest runs successfully with 0 import errors"
    - "Test coverage remains at current level"
    - "No new test failures introduced"

# ============================================================================
# PHASE 6C: sys.path Removal from Scripts (7 files)
# ============================================================================

phase_6c_script_sys_path_removal:
  title: "Remove sys.path Hacks from Script Files"
  depends_on:
    - phase_6b_test_sys_path_removal
  estimated_effort: "1-2 hours"
  files_modified: 7

  affected_files:
    - scripts/scribe.py:32
    - scripts/scribe_cli.py:15
    - scripts/scribe_probe.py:24
    - scripts/reindex_docs.py:26
    - scripts/reindex_vector.py:47
    - scripts/check_vector_index.py:19
    - template_engine/cli.py:10

  migration_strategy:
    old_invocation: "python scripts/scribe.py --help"
    new_invocation: "python -m scribe_mcp.scripts.scribe --help"

    steps:
      - remove_sys_path_lines: true
      - update_shebang: "#!/usr/bin/env python -m scribe_mcp.scripts.scribe"
      - update_documentation: ["CLAUDE.md", "README.md"]
      - create_convenience_wrappers: true  # Optional shell scripts

  convenience_wrappers:
    description: "Optional: Create shell wrappers for backward compatibility"
    location: "bin/"
    examples:
      scribe:
        file: "bin/scribe"
        content: |
          #!/bin/bash
          python -m scribe_mcp.scripts.scribe "$@"
        chmod: "+x"

  validation:
    - "python -m scribe_mcp.scripts.scribe --list-projects"
    - "python -m scribe_mcp.scripts.scribe_probe"
    - "python -m scribe_mcp.scripts.reindex_docs"

# ============================================================================
# PHASE 6D: sys.path Removal from Server (1 file)
# ============================================================================

phase_6d_server_sys_path_removal:
  title: "Remove sys.path Hack from server.py"
  depends_on:
    - phase_6c_script_sys_path_removal
  estimated_effort: "30 minutes"
  files_modified: 1

  file: "server.py"
  lines_to_remove:
    - 14-18  # Comment and sys.path.insert block

  old_code: |
    # Ensure the repository root (which contains the `scribe_mcp` package) is on sys.path.
    # This allows running `python server.py` or `python -m server` from within the package directory.
    _REPO_ROOT = Path(__file__).resolve().parent.parent
    if str(_REPO_ROOT) not in sys.path:
        sys.path.insert(0, str(_REPO_ROOT))

  new_invocation:
    old: "python server.py"
    new: "python -m scribe_mcp.server"
    note: "Requires editable install: pip install -e ."

  documentation_updates:
    - file: "CLAUDE.md"
      section: "Running the Scribe MCP Server"
      change: "Update primary method to 'python -m scribe_mcp.server'"

    - file: "README.md"
      section: "Quick Start"
      change: "Add 'pip install -e .' before server invocation"

# ============================================================================
# PHASE 6E: Template Syntax Validation
# ============================================================================

phase_6e_template_validation:
  title: "Validate All Templates Use Jinja2 Syntax"
  depends_on: []  # Can run in parallel with sys.path removal
  estimated_effort: "1-2 hours"

  validation_steps:
    scan_for_old_syntax:
      command: |
        # Find templates using {variable} instead of {{ variable }}
        grep -r '\{[a-zA-Z_][a-zA-Z0-9_]*\}' template_engine/templates/ \
          --include="*.md" --include="*.txt" -n
      expected: "No matches (all templates use Jinja2)"

    test_strict_mode:
      description: "Test all template rendering with fallback disabled"
      script: |
        # In template_engine tests, add:
        engine = Jinja2TemplateEngine(...)
        result = engine.render_template(
            "template_name.md",
            metadata={...},
            strict=True,
            fallback=False
        )
      expected: "No TemplateRenderError exceptions"

  acceptance_criteria:
    - "Zero templates found using old {variable} syntax"
    - "All template tests pass with strict=True, fallback=False"
    - "Documentation updated to specify Jinja2-only"

# ============================================================================
# PHASE 6F: Template Fallback Code Removal
# ============================================================================

phase_6f_template_fallback_removal:
  title: "Remove Legacy Template Fallback System"
  depends_on:
    - phase_6e_template_validation
  estimated_effort: "1 hour"
  lines_removed: ~125

  files_modified:
    template_engine/engine.py:
      remove_lines:
        - 48-49   # LEGACY_PATTERN constant
        - 380-398 # _render_legacy_template method

      modify_functions:
        render_template:
          old_signature: "render_template(self, template_name, metadata=None, strict=False, fallback=True)"
          new_signature: "render_template(self, template_name, metadata=None, strict=False)"
          remove_parameter: "fallback"
          remove_code_blocks:
            - lines: 440-451  # Fallback try/except block

        render_string:
          old_signature: "render_string(self, template_string, metadata=None, strict=False, fallback=True)"
          new_signature: "render_string(self, template_string, metadata=None, strict=False)"
          remove_parameter: "fallback"
          remove_code_blocks:
            - lines: 489-498  # Fallback try/except block

    template_engine/cli.py:
      remove_cli_flags:
        - "--no-fallback"  # Line 50
        - "--enable-fail-hard"  # Line 62 (redundant with strict mode)

  breaking_changes:
    api_changes:
      - "render_template() no longer accepts 'fallback' parameter"
      - "render_string() no longer accepts 'fallback' parameter"
      - "Old {variable} syntax will now raise TemplateRenderError"

    migration_notes:
      - "All templates must use Jinja2 {{ variable }} syntax"
      - "Use strict=True for fail-fast behavior"
      - "No backward compatibility with old template format"

# ============================================================================
# PHASE 5-6: reminders.py Deprecation (Multi-Release)
# ============================================================================

reminders_deprecation_track:
  title: "Phased Deprecation of reminders.py Compatibility Shim"
  type: "Multi-release migration"
  risk_level: CRITICAL
  affected_modules: 28  # All tools import from reminders.py

  phase_5_deprecation_warnings:
    version: "v2.2"
    effort: "2 hours"
    breaking: false

    changes:
      reminders.py:
        add_module_level_warning:
          location: "After imports, before functions"
          code: |
            import warnings

            warnings.warn(
                "The scribe_mcp.reminders module is deprecated and will be removed in v3.0. "
                "Use scribe_mcp.utils.reminder_engine.ReminderEngine directly. "
                "See migration guide: docs/migration/reminders_v3.md",
                DeprecationWarning,
                stacklevel=2
            )

        add_function_level_warnings:
          functions:
            - get_reminders
            - _build_legacy_context
            - _build_config
          warning_code: |
            warnings.warn(
                f"{__name__}.{function_name} is deprecated. "
                "Use utils.reminder_engine directly. "
                "This function will be removed in v3.0",
                DeprecationWarning,
                stacklevel=2
            )

    documentation:
      create:
        - file: "docs/migration/reminders_v3.md"
          content: |
            # Reminders API Migration Guide (v3.0)

            ## Old API (Deprecated)
            from scribe_mcp.reminders import get_reminders
            reminders = await get_reminders(project, tool_name=...)

            ## New API (v3.0+)
            from scribe_mcp.utils.reminder_engine import ReminderEngine
            from scribe_mcp.utils.reminder_validator import validate_and_load_engine

            engine = validate_and_load_engine()
            context = ReminderContext(tool_name=..., project_name=...)
            reminders = await engine.generate_reminders(context)

  phase_v2_3_grace_period:
    version: "v2.3"
    effort: "0 hours (no code changes)"
    purpose: "Allow users time to migrate with warnings visible"
    duration: "1-2 releases"

  phase_v3_0_removal:
    version: "v3.0"
    effort: "28+ hours (update all tools)"
    breaking: true

    changes:
      delete_file:
        - reminders.py  # 418 lines removed

      update_all_tools:
        count: 28
        pattern:
          old_import: "from scribe_mcp.reminders import get_reminders"
          new_import: |
            from scribe_mcp.utils.reminder_engine import ReminderEngine
            from scribe_mcp.utils.reminder_validator import validate_and_load_engine

          old_usage: |
            reminders = await get_reminders(
                project,
                tool_name=tool_name,
                state=state,
                agent_id=agent_id
            )

          new_usage: |
            engine = validate_and_load_engine()
            # Inject storage for DB-based cooldowns
            from scribe_mcp.storage.sqlite import SQLiteStorage
            engine.storage = SQLiteStorage(db_path)

            context = ReminderContext(
                tool_name=tool_name,
                project_name=project.get("name"),
                project_root=project.get("root"),
                agent_id=agent_id,
                # ... other context fields
            )
            reminders = await engine.generate_reminders(context)

      testing:
        - "Run full integration test suite"
        - "Test reminder generation for all 28 tools"
        - "Verify DB-based cooldown tracking works"
        - "Test multilingual reminder support"

  migration_timeline:
    v2_2_release:
      date: "TBD"
      changes: "Deprecation warnings added"
      breaking: false

    v2_3_release:
      date: "TBD (1-2 months after v2.2)"
      changes: "Warnings remain, grace period"
      breaking: false

    v3_0_release:
      date: "TBD (2-3 months after v2.3)"
      changes: "reminders.py removed, 28 tools migrated"
      breaking: true

