### get_project Tests

```python
async def test_get_project_verbosity():
    await set_project(name="verbose_test")

    # Default (concise)
    result_concise = await get_project(format="readable")
    assert isinstance(result_concise, str)
    concise_size = len(result_concise)

    # Verbose (with recent activity)
    result_verbose = await get_project(format="readable", verbose=True)
    assert isinstance(result_verbose, str)
    verbose_size = len(result_verbose)

    # Verbose should be significantly larger
    assert verbose_size > concise_size * 2

    # Concise should match structured data scope
    result_json = await get_project(format="structured")
    json_size = len(json.dumps(result_json))
    assert abs(concise_size - json_size) < json_size * 0.3  # Within 30%

async def test_get_project_default_not_verbose():
    # Verify default is NOT verbose
    result = await get_project(format="readable")

    # Should NOT include recent entries by default
    assert "Recent entries:" not in result
    assert "Last 5 entries:" not in result
```

