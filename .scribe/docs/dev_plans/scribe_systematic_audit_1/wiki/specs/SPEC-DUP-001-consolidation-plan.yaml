# ============================================================================
# PATTERN 1: _count_log_entries Consolidation
# ============================================================================

pattern_001:
  id: DUPLICATION-001
  name: "_count_log_entries (2x implementations)"
  bucket: "[BUCKET:persistence]"
  priority: P1-HIGH
  loc_waste: 23
  similarity: 0.40

  problem:
    description: "Two incompatible implementations of log entry counting"
    risk: "Behavioral inconsistency - same log file may produce different counts"

    implementations:
      - file: tools/set_project.py
        lines: [36, 58]
        loc: 23
        approach: "Regex pattern matching (^\\[\\d{4}-\\d{2}-\\d{2})"
        call_sites: [118, 458]

      - file: tools/get_project.py
        lines: [43, 52]
        loc: 10
        approach: "parse_log_line() utility function"
        call_sites: [64]

  consolidation:
    target_module: utils/logs.py
    function_name: count_log_entries
    signature: "async def count_log_entries(log_path: Union[str, Path]) -> int"

    implementation_approach: "Use parse_log_line() for consistent validation"

    benefits:
      - "Single source of truth for entry counting"
      - "Consistent behavior across all tools"
      - "Leverages existing parse_log_line() validation"
      - "23 LOC eliminated"

    migration_steps:
      - step: 1
        action: "Create utils/logs.py::count_log_entries()"
        description: "Implement using parse_log_line() approach"
        estimated_loc: 15

      - step: 2
        action: "Update tools/set_project.py"
        description: "Replace _count_log_entries() with utils.logs.count_log_entries()"
        lines_affected: [36-58, 118, 458]
        loc_removed: 23
        loc_added: 3

      - step: 3
        action: "Update tools/get_project.py"
        description: "Replace _count_log_entries() with utils.logs.count_log_entries()"
        lines_affected: [43-52, 64]
        loc_removed: 10
        loc_added: 1

      - step: 4
        action: "Add comprehensive tests"
        description: "Test count_log_entries() with various log formats"
        test_file: tests/test_log_utils.py
        test_cases: ["empty_log", "single_entry", "multiple_entries", "template_headers", "invalid_entries"]

      - step: 5
        action: "Run regression tests"
        description: "Verify set_project and get_project behavior unchanged"
        test_targets: ["test_set_project.py", "test_get_project.py"]

  acceptance_criteria:
    - "Single count_log_entries() function in utils/logs.py"
    - "All call sites updated (3 total: 2 in set_project.py, 1 in get_project.py)"
    - "Behavioral consistency verified (same counts for same log files)"
    - "All tests passing (100% coverage for count_log_entries)"
    - "23 LOC eliminated from tools/"

