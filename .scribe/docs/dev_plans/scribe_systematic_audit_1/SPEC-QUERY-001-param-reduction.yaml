## Refactoring Initiatives

### Initiative 1: Unify Project Loading Logic

**Objective**: Eliminate 49-line duplication in cross-project scope resolution.

**Current State**:
- `all_projects` scope (lines 1279-1297): Iterate all projects
- `research/bugs/all` scopes (lines 1312-1330): **IDENTICAL** iteration + filter

**Target State**:
```python
def _load_project_with_fallback(state, project_name: str) -> Optional[Dict]:
    """Load single project from state or config fallback."""
    project_dict = state.get_project(project_name)
    if not project_dict:
        return None

    if not project_dict.get("progress_log"):
        fallback = load_project_config(project_name)
        if fallback:
            fallback["name"] = project_name
            return fallback
        return None

    project_dict["name"] = project_name
    return project_dict


def _load_all_projects(state) -> List[Dict]:
    """Load all projects from state with fallback to config."""
    projects = []
    for project_name in state.projects:
        project_dict = _load_project_with_fallback(state, project_name)
        if project_dict:
            projects.append(project_dict)
    return projects


def _resolve_cross_project_projects(scope, document_types):
    """Resolve projects to search based on scope and document types."""
    if scope == "global":
        return [_create_global_config()]

    projects = _load_all_projects(state)

    if scope == "all_projects":
        return projects

    if scope in ["research", "bugs", "all"]:
        filtered = [
            p for p in projects
            if _project_has_document_types(p, document_types, scope)
        ]
        filtered.append(_create_global_config())
        return filtered

    return []
```

**Impact**:
- **Lines Removed**: 49 (duplication)
- **Lines Added**: 35 (new functions)
- **Net**: -14 LOC
- **Bugs Fixed**: Centralized project loading = one place to fix bugs
- **Maintainability**: +High (new scopes don't duplicate iteration)

**Files Modified**:
- `tools/query_entries.py` (lines 1271-1341)

**Testing**:
- Verify all 6 scopes return correct project lists
- Test state/config fallback logic
