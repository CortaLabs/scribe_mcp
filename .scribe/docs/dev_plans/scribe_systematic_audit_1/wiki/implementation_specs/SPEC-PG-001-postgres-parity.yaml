### 3.6 Priority 6: Document Management 2.0 (4 tables + FTS)

**Complexity**: HIGHEST - requires FTS5 → tsvector conversion

**Files Modified**: `db/init.sql`

```sql
-- Table 1: document_sections
CREATE TABLE IF NOT EXISTS document_sections (
    id SERIAL PRIMARY KEY,
    project_id INTEGER REFERENCES scribe_projects(id) ON DELETE CASCADE,
    project_root TEXT,
    document_type TEXT,
    section_id TEXT,
    file_path TEXT,
    relative_path TEXT,
    content TEXT NOT NULL,
    file_hash TEXT NOT NULL,
    metadata JSONB,
    created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
    updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
    content_tsvector tsvector,  -- Full-text search column
    UNIQUE(project_id, document_type, section_id),
    UNIQUE(project_root, file_path)
);

-- Full-text search index
CREATE INDEX idx_document_sections_fts ON document_sections USING GIN(content_tsvector);

-- Auto-update tsvector trigger
CREATE TRIGGER document_sections_tsvector_update
BEFORE INSERT OR UPDATE ON document_sections
FOR EACH ROW EXECUTE FUNCTION
tsvector_update_trigger(content_tsvector, 'pg_catalog.english', content);

-- Table 2: custom_templates
CREATE TABLE IF NOT EXISTS custom_templates (
    id SERIAL PRIMARY KEY,
    project_id INTEGER NOT NULL REFERENCES scribe_projects(id) ON DELETE CASCADE,
    template_name TEXT NOT NULL,
    template_content TEXT NOT NULL,
    variables JSONB,
    is_global BOOLEAN NOT NULL DEFAULT FALSE,
    created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
    updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
    UNIQUE(project_id, template_name)
);

-- Table 3: document_changes
CREATE TABLE IF NOT EXISTS document_changes (
    id SERIAL PRIMARY KEY,
    project_id INTEGER REFERENCES scribe_projects(id) ON DELETE CASCADE,
    project_root TEXT,
    file_path TEXT,
    change_type TEXT NOT NULL,
    old_content_hash TEXT,
    new_content_hash TEXT,
    change_summary TEXT,
    metadata JSONB,
    created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
);

CREATE INDEX idx_document_changes_project ON document_changes(project_id);
CREATE INDEX idx_document_changes_created ON document_changes(created_at);

-- Table 4: sync_status
CREATE TABLE IF NOT EXISTS sync_status (
    id SERIAL PRIMARY KEY,
    project_id INTEGER REFERENCES scribe_projects(id) ON DELETE CASCADE,
    project_root TEXT,
    file_path TEXT NOT NULL,
    relative_path TEXT,
    last_sync_at TIMESTAMPTZ,
    last_file_hash TEXT,
    last_db_hash TEXT,
    sync_status TEXT NOT NULL DEFAULT 'synced',
    conflict_details JSONB,
    created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
    updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
    UNIQUE(project_id, file_path)
);

CREATE INDEX idx_sync_status_project ON sync_status(project_id);
CREATE INDEX idx_sync_status_status ON sync_status(sync_status);
```

**Query Migration** (FTS5 → tsvector):

```sql
-- OLD (SQLite FTS5):
SELECT * FROM document_sections_fts WHERE content MATCH 'search term'

-- NEW (PostgreSQL tsvector):
SELECT * FROM document_sections
WHERE content_tsvector @@ to_tsquery('english', 'search & term')
```

**Estimated Effort**: 40-60 hours (includes query migration, testing)

