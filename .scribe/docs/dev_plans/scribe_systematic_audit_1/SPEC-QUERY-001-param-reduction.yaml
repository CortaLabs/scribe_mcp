### Initiative 2: Extract Filter Chain Abstraction

**Objective**: Make filters composable, testable, and reusable.

**Current State**:
- 10 filters hard-coded inline (lines 667-756)
- Imperative if-continue pattern
- Cannot test filters independently
- Cannot reorder or extend without editing monolith

**Target State**:
```python
# New file: scribe_mcp/utils/filters.py

from abc import ABC, abstractmethod
from typing import Dict, List, Optional, Any

class Filter(ABC):
    """Base class for entry filters."""

    @abstractmethod
    def matches(self, entry: Dict) -> bool:
        """Return True if entry matches filter criteria."""
        pass


class MessageFilter(Filter):
    def __init__(self, pattern: str, mode: str, case_sensitive: bool):
        self.pattern = pattern
        self.mode = mode
        self.case_sensitive = case_sensitive

    def matches(self, entry: Dict) -> bool:
        from scribe_mcp.utils.search import message_matches
        message = entry.get("message", "")
        return message_matches(message, self.pattern, self.mode, self.case_sensitive)


class EmojiFilter(Filter):
    def __init__(self, emojis: List[str]):
        self.emojis = set(emojis)

    def matches(self, entry: Dict) -> bool:
        return entry.get("emoji", "") in self.emojis


class StatusFilter(Filter):
    """Filter by status (maps to emojis)."""

    def __init__(self, statuses: List[str]):
        from scribe_mcp.tools.constants import STATUS_EMOJI
        self.allowed_emojis = set()
        for status in statuses:
            self.allowed_emojis.update(STATUS_EMOJI.get(status.lower(), []))

    def matches(self, entry: Dict) -> bool:
        return entry.get("emoji", "") in self.allowed_emojis


class AgentFilter(Filter):
    def __init__(self, agents: List[str]):
        self.agents = set(agents)

    def matches(self, entry: Dict) -> bool:
        return entry.get("agent", "") in self.agents


class MetadataFilter(Filter):
    def __init__(self, meta_filters: Dict[str, Any]):
        from scribe_mcp.shared.logging_utils import normalize_meta_filters
        self.filters, _ = normalize_meta_filters(meta_filters)

    def matches(self, entry: Dict) -> bool:
        from tools.query_entries import _meta_matches
        entry_meta = entry.get("meta", {}) or {}
        return _meta_matches(entry_meta, self.filters)


class PriorityFilter(Filter):
    def __init__(self, priorities: List[str]):
        self.priorities = set(priorities)

    def matches(self, entry: Dict) -> bool:
        entry_priority = entry.get("meta", {}).get("priority", "medium")
        return entry_priority in self.priorities


class CategoryFilter(Filter):
    def __init__(self, categories: List[str]):
        self.categories = set(categories)

    def matches(self, entry: Dict) -> bool:
        entry_category = entry.get("meta", {}).get("category")
        return entry_category in self.categories


class ConfidenceFilter(Filter):
    def __init__(self, min_confidence: float):
        self.min_confidence = min_confidence

    def matches(self, entry: Dict) -> bool:
        entry_confidence = float(entry.get("meta", {}).get("confidence", 1.0))
        return entry_confidence >= self.min_confidence


class TimeRangeFilter(Filter):
    def __init__(self, start: Optional[str], end: Optional[str]):
        from datetime import datetime
        self.start_dt = None
        self.end_dt = None

        if start:
            self.start_dt = datetime.fromisoformat(start.replace('Z', '+00:00'))
        if end:
            self.end_dt = datetime.fromisoformat(end.replace('Z', '+00:00'))

    def matches(self, entry: Dict) -> bool:
        entry_timestamp = entry.get("ts", "")
        if not entry_timestamp:
            return False

        try:
            from datetime import datetime
            entry_dt = datetime.fromisoformat(entry_timestamp.replace('Z', '+00:00'))

            if self.start_dt and entry_dt < self.start_dt:
                return False
            if self.end_dt and entry_dt > self.end_dt:
                return False
            return True
        except ValueError:
            return False


class RelevanceFilter(Filter):
    def __init__(self, threshold: float):
        self.threshold = threshold

    def matches(self, entry: Dict) -> bool:
        if self.threshold <= 0.0:
            return True
        message = entry.get("message", "")
        relevance_score = len(message) / 1000.0
        return relevance_score >= self.threshold


class FilterChain:
    """Compose multiple filters with AND logic."""

    def __init__(self, filters: List[Filter]):
        self.filters = filters

    def apply(self, entries: List[Dict]) -> List[Dict]:
        """Return entries matching ALL filters."""
        return [
            entry for entry in entries
            if all(f.matches(entry) for f in self.filters)
        ]


def build_filter_chain(
    message: Optional[str] = None,
    message_mode: str = "substring",
    case_sensitive: bool = False,
    emoji: Optional[List[str]] = None,
    status: Optional[List[str]] = None,
    agents: Optional[List[str]] = None,
    meta_filters: Optional[Dict[str, Any]] = None,
    priority: Optional[List[str]] = None,
    category: Optional[List[str]] = None,
    min_confidence: Optional[float] = None,
    start: Optional[str] = None,
    end: Optional[str] = None,
    relevance_threshold: float = 0.0,
) -> FilterChain:
    """Build filter chain from search parameters."""
    filters = []

    if message:
        filters.append(MessageFilter(message, message_mode, case_sensitive))
    if emoji:
        filters.append(EmojiFilter(emoji))
    if status:
        filters.append(StatusFilter(status))
    if agents:
        filters.append(AgentFilter(agents))
    if meta_filters:
        filters.append(MetadataFilter(meta_filters))
    if priority:
        filters.append(PriorityFilter(priority))
    if category:
        filters.append(CategoryFilter(category))
    if min_confidence is not None:
        filters.append(ConfidenceFilter(min_confidence))
    if start or end:
        filters.append(TimeRangeFilter(start, end))
    if relevance_threshold > 0.0:
        filters.append(RelevanceFilter(relevance_threshold))

    return FilterChain(filters)
```

