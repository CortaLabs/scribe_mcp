## 6. Linting Rule (pylint/flake8)

**Custom Rule**:
```python
# tools/lint_rules/no_direct_db_access.py
"""Prevent direct database access outside storage layer."""

import ast

ALLOWED_FILES = [
    'storage/sqlite.py',
    'storage/postgres.py',
    'db/ops.py',
    'db/pool.py',
    'plugins/vector_indexer.py',  # Documented exception
    'tests/*',  # Tests can verify DB directly
    'scripts/*'  # Utility scripts exempt
]

def check_no_direct_db_access(filename: str, tree: ast.AST) -> List[Violation]:
    """Ensure no sqlite3.connect() or asyncpg usage outside storage layer."""
    if any(fnmatch.fnmatch(filename, pattern) for pattern in ALLOWED_FILES):
        return []

    violations = []
    for node in ast.walk(tree):
        if isinstance(node, ast.Call):
            if isinstance(node.func, ast.Attribute):
                # Check for sqlite3.connect()
                if (node.func.attr == 'connect' and
                    isinstance(node.func.value, ast.Name) and
                    node.func.value.id == 'sqlite3'):
                    violations.append({
                        'line': node.lineno,
                        'message': 'Direct sqlite3.connect() bypasses abstraction layer'
                    })
        elif isinstance(node, ast.Import):
            # Check for asyncpg imports
            for alias in node.names:
                if alias.name == 'asyncpg':
                    violations.append({
                        'line': node.lineno,
                        'message': 'Direct asyncpg import bypasses abstraction layer'
                    })

    return violations
```

