          input_per_mtok: 0.0
          output_per_mtok: 0.0
  retrieval:
    min_tier: null
    max_per_tag_cluster: 3
    recency_half_life_days: 30
    dual_pool:
      personal_weight: 0.6
      domain_weight: 0.4
  context:
    max_context_tokens: 6000
    max_thread_events: 50
  reasoning:
    governance_enabled: true
    log_passes: true
    pass_1_temperature: 0.5
    pass_2_temperature: 0.7
    pass_3_temperature: 0.3
  explore:
    max_limit: 50
  daemon_federation:
    enabled: true
    shared_secret: 2abd7fa519fd0cdb18c5500a75e9bac0bee1c44efa1458dc6cdbcdc936d5163b
