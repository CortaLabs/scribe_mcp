## Risks & Mitigations

| Risk | Impact | Probability | Mitigation |
|------|--------|-------------|------------|
| Data loss during migration | HIGH | LOW | Backup database before ALTER TABLE |
| JSON parse errors | MEDIUM | MEDIUM | Add error handling, fallback to state.json |
| Concurrent access during migration | MEDIUM | LOW | Run during low-traffic period, use transactions |
| Backfill fails for some projects | MEDIUM | MEDIUM | Log failures, provide manual fix procedure |
| Incomplete project data in state.json | LOW | LOW | Validate before backfill, use defaults |

