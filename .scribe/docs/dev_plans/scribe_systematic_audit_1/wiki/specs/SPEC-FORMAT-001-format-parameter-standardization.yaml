# Problem Statement

## Current State

**Systemic Bug**: Compact mode returns **byte-for-byte identical JSON** to structured mode across 100% of tested tools (8/8 tools, projected 16/16).

**Impact**:
- Zero token savings from compact mode (expected 20-30% reduction)
- Inconsistent format parameter support across tools
- No standardized format dispatch logic
- 2 tools intentionally lack format support (by design)
- 1 tool missing readable mode entirely (rotate_log)

## Evidence

**Testing Coverage**: 11/16 tools tested (68.75%)

**Compact Mode Failure Rate**: 100% (8/8 tested tools)

**Tools Affected**:
1. list_projects - C=S (666 chars identical)
2. get_project - C=S (651 chars identical)
3. read_recent - C=S (10,500 chars identical)
4. query_entries - C=S (4,500 chars identical)
5. rotate_log - C=S (429 chars identical) + NO readable mode
6. set_project - C=S (1,100 chars identical)
7. read_file - C=S (440 chars identical)
8. append_entry - No JSON modes (may be intentional)

**Success Cases**:
- Readable mode: 52% avg token reduction (highly effective)
- Structured mode: Baseline JSON output (works correctly)

