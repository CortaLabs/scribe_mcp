pattern_003:
  id: DUPLICATION-003
  name: "Config class infrastructure (3x implementations)"
  bucket: "[BUCKET:config]"
  priority: P0-CRITICAL
  loc_total: 1674
  infrastructure_duplication: 400
  similarity: 0.95

  problem:
    description: "Three config classes implement nearly identical validation/normalization infrastructure"
    risk: "3x maintenance burden for infrastructure changes, 150 LOC boilerplate for new configs"

    implementations:
      - file: tools/config/append_entry_config.py
        class: AppendEntryConfig
        total_loc: 590
        infrastructure_loc: 150
        parameters: 25

      - file: tools/config/query_entries_config.py
        class: QueryEntriesConfig
        total_loc: 590
        infrastructure_loc: 150
        parameters: 26

      - file: tools/config/rotate_log_config.py
        class: RotateLogConfig
        total_loc: 494
        infrastructure_loc: 100
        parameters: 11

    shared_infrastructure:
      - pattern: "__post_init__() hook with normalize + validate"
        similarity: 0.95

      - pattern: "Phase 1 utility imports (ToolValidator, ConfigManager, ErrorHandler)"
        similarity: 1.0

      - pattern: "List parameter normalization via validate_list_parameter()"
        similarity: 1.0

      - pattern: "Enum validation with error messages"
        similarity: 0.90

      - pattern: "JSON metadata validation"
        similarity: 0.95

      - pattern: "Field defaults using dataclass.field()"
        similarity: 1.0

  consolidation:
    target_module: tools/config/base_tool_config.py
    class_name: BaseToolConfig
    pattern: "Abstract base class with shared infrastructure"

    base_class_structure:
      class_definition: |
        @dataclass
        class BaseToolConfig(ABC):
            """
            Base configuration class for all MCP tool configs.

            Provides shared infrastructure:
            - Phase 1 utility integration
            - Standard validation patterns
            - Normalization framework
            - Error collection and reporting
            """

      shared_fields:
        - name: _validator
          type: ToolValidator
          default: "field(default_factory=ToolValidator, init=False)"

        - name: _config_manager
          type: ConfigManager
          default: "field(init=False)"

        - name: _error_handler
          type: ErrorHandler
          default: "field(default_factory=ErrorHandler, init=False)"

      shared_methods:
        - name: __post_init__
          signature: "def __post_init__(self) -> None"
          implementation: "self.normalize(); self.validate()"

        - name: normalize
          signature: "@abstractmethod def normalize(self) -> None"
          note: "Override in subclasses for specific normalization"

        - name: validate
          signature: "@abstractmethod def validate(self) -> None"
          note: "Override in subclasses for specific validation"

        - name: normalize_list_parameter
          signature: "def normalize_list_parameter(value, delimiter=',') -> Optional[List[str]]"
          implementation: "return self._validator.validate_list_parameter(value, delimiter)"

        - name: validate_enum_parameter
          signature: "def validate_enum_parameter(value, valid_values, param_name) -> str"
          implementation: "Shared enum validation with error raising"

        - name: validate_json_metadata
          signature: "def validate_json_metadata(metadata, field_name) -> Optional[Dict]"
          implementation: "Shared JSON validation via ToolValidator"

    benefits:
      - "300-400 LOC of infrastructure duplication eliminated"
      - "67% reduction in boilerplate for new config classes (150 LOC → 50 LOC)"
      - "Single location for Phase 1 utility integration"
      - "Consistent validation behavior across all configs"
      - "Easier to add new config classes (inherit from base)"

    migration_steps:
      - step: 1
        action: "Create tools/config/base_tool_config.py"
        description: "Implement abstract base class with shared infrastructure"
        estimated_loc: 100
        includes:
          - "Abstract base class definition"
          - "Shared utility field definitions"
          - "Common validation methods"
          - "List/enum/JSON normalization patterns"

      - step: 2
        action: "Refactor AppendEntryConfig to inherit from BaseToolConfig"
        description: "Remove duplicated infrastructure, use base class methods"
        file: tools/config/append_entry_config.py
        changes:
          - "Change class definition: class AppendEntryConfig(BaseToolConfig)"
          - "Remove _validator, _config_manager, _error_handler fields (inherited)"
          - "Remove __post_init__ (inherited)"
          - "Update normalize() to call base class methods"
          - "Update validate() to use base class enum/list validation"
        loc_reduction: ~150

      - step: 3
        action: "Refactor QueryEntriesConfig to inherit from BaseToolConfig"
        description: "Remove duplicated infrastructure, use base class methods"
        file: tools/config/query_entries_config.py
        changes:
          - "Change class definition: class QueryEntriesConfig(BaseToolConfig)"
          - "Remove duplicated infrastructure fields"
          - "Use base class normalization/validation methods"
        loc_reduction: ~150

      - step: 4
        action: "Refactor RotateLogConfig to inherit from BaseToolConfig"
        description: "Remove duplicated infrastructure, use base class methods"
        file: tools/config/rotate_log_config.py
        changes:
          - "Change class definition: class RotateLogConfig(BaseToolConfig)"
          - "Remove duplicated infrastructure fields"
          - "Use base class methods"
        loc_reduction: ~100

      - step: 5
        action: "Add comprehensive tests for BaseToolConfig"
        description: "Test shared infrastructure independently"
        test_file: tests/test_base_tool_config.py
        test_cases:
          - "test_post_init_calls_normalize_and_validate"
          - "test_normalize_list_parameter"
          - "test_validate_enum_parameter"
          - "test_validate_json_metadata"
          - "test_error_collection_patterns"

      - step: 6
        action: "Run full test suite"
        description: "Verify all config classes behave identically after refactoring"
        test_targets:
          - "tests/test_append_entry_config.py"
          - "tests/test_query_entries_config.py"
          - "tests/test_rotate_log_config.py"

  acceptance_criteria:
