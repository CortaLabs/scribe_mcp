    implementations:
      - file: tools/set_project.py
        function: _gather_project_inventory
        lines: [61, 127]
        loc: 67
        features: ["architecture", "phase_plan", "checklist", "progress", "custom_content"]
        calls_formatter_private: true

      - file: tools/list_projects.py
        function: _gather_doc_info
        lines: [50, 128]
