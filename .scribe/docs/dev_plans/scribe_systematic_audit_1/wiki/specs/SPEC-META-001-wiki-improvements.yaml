# ============================================================================
# IMPROVEMENT 5: Create Phase Summary One-Pagers
# ============================================================================

improvement_005:
  id: WIKI-IMP-005
  name: "Phase Summary One-Pagers"
  priority: P2-MEDIUM
  effort: "1 hour"

  problem:
    description: "No concise executive summaries for each phase"
    impact: "Hard for stakeholders to get high-level overview without reading full reports"

  proposed_solution:
    approach: "Create PHASE_<N>_SUMMARY.md for each completed phase"
    location: "wiki/summaries/ (new directory)"

    template: |
      # Phase <N> Summary: <Phase Name>

      **Duration**: <days>
      **Effort**: <hours>
      **Agent(s)**: <agent names>
      **Status**: <COMPLETE/IN_PROGRESS>

      ## Objective
      <1-2 sentence phase goal>

      ## Key Deliverables
      - <deliverable 1 with link>
      - <deliverable 2 with link>

      ## Metrics
      - **Files analyzed**: <count>
      - **LOC audited**: <count>
      - **Issues found**: <count>
      - **Specs created**: <count>

      ## Top 3 Findings
      1. <finding 1>
      2. <finding 2>
      3. <finding 3>

      ## Implementation Impact
      <1 paragraph on what Phase 6 should prioritize from this phase>

      ## Links
      - [Full Phase Plan](../PHASE_PLAN.md#phase_<n>)
      - [Review Report](../review/PHASE_<N>_REVIEW.md)

    phases_to_create:
      - phase: 0
        name: "Charter & Baseline"
      - phase: 1
        name: "Tool-by-Tool Audit"
      - phase: 2
        name: "Storage Layer"
      - phase: 3
        name: "Import Graph & Packaging"
      - phase: 4
        name: "Dead Code & Validation"

  validation:
    - "5 summary files created in wiki/summaries/"
    - "All summaries follow template"
    - "Links to full reports working"

