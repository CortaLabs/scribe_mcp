## 8. Migration Impact

### Backward Compatibility

**Breaking Changes**:
- ProjectRegistry now requires StorageBackend parameter
- ProjectRegistry methods are now async
- Callers must be updated

**Migration Path**:
```python
# OLD (synchronous):
registry = ProjectRegistry()
registry.touch_access("my_project")

# NEW (asynchronous):
storage = await get_storage_backend()
registry = ProjectRegistry(storage)
await registry.touch_access("my_project")
```

### Affected Callers

All files importing `ProjectRegistry`:
- `tools/set_project.py`
- `tools/get_project.py`
- `tools/list_projects.py`
- Any other project management code

**Estimated Caller Updates**: 5-8 hours

