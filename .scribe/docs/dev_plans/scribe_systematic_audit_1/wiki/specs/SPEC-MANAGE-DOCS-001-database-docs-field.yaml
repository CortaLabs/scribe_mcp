### Phase 3: Update set_project Tool

**File:** `tools/set_project.py`

**Current Behavior:** set_project creates/updates projects but doesn't write to database (only state.json)

**Required Changes:**

1. **When creating new project:**
```python
# After generating docs mapping
docs = {
    "architecture": str(docs_dir / "ARCHITECTURE_GUIDE.md"),
    "phase_plan": str(docs_dir / "PHASE_PLAN.md"),
    "checklist": str(docs_dir / "CHECKLIST.md"),
    "progress_log": str(docs_dir / "PROGRESS_LOG.md"),
}

# INSERT into database with docs_json
import json
docs_json = json.dumps(docs)

backend = getattr(server_module, "storage_backend", None)
if backend and hasattr(backend, "ensure_project_exists"):
    await backend.ensure_project_exists(
        name=name,
        repo_root=str(repo_root),
        progress_log_path=str(progress_log),
        docs_json=docs_json  # NEW PARAMETER
    )
```

2. **When updating existing project:**
```python
# If docs mapping changes, update database
if backend and hasattr(backend, "update_project_docs"):
    docs_json = json.dumps(project_data["docs"])
    await backend.update_project_docs(name, docs_json)
```

**New Backend Methods Required:**

```python
# In storage/sqlite.py or storage/base.py

async def ensure_project_exists(
    self,
    name: str,
    repo_root: str,
    progress_log_path: str,
    docs_json: Optional[str] = None,  # NEW
) -> None:
    """Ensure project exists in database with all fields."""
    async with self._conn() as conn:
        await conn.execute(
            """
            INSERT INTO scribe_projects
                (name, repo_root, progress_log_path, docs_json)
            VALUES (?, ?, ?, ?)
            ON CONFLICT(name) DO UPDATE SET
                repo_root = excluded.repo_root,
                progress_log_path = excluded.progress_log_path,
                docs_json = excluded.docs_json,  -- NEW
                updated_at = CURRENT_TIMESTAMP
            """,
            (name, repo_root, progress_log_path, docs_json)
        )

async def update_project_docs(self, name: str, docs_json: str) -> None:
    """Update docs_json field for a project."""
    async with self._conn() as conn:
        await conn.execute(
            "UPDATE scribe_projects SET docs_json = ?, updated_at = CURRENT_TIMESTAMP WHERE name = ?",
            (docs_json, name)
        )
```

