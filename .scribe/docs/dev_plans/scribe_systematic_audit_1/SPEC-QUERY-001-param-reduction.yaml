## Migration Path

### Backward Compatibility
Keep 25-parameter signature for one release cycle:
```python
async def query_entries(
    project: Optional[str] = None,
    # ... all 25 legacy parameters
    config: Optional[QueryEntriesConfig] = None,
    **kwargs
) -> Dict[str, Any]:
    """Search with legacy parameters or config object."""
    if not config:
        config = QueryEntriesConfig.from_legacy_params(
            project=project,
            # ... map all 25 parameters
        )
    # New implementation uses config exclusively
```

### Deprecation Notice
Add to docstring:
```
DEPRECATION WARNING: Using individual parameters is deprecated.
Pass QueryEntriesConfig object instead. Individual parameters
will be removed in v3.0.
```

