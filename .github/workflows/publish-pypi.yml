name: Publish scribe-mcp to PyPI

on:
  push:
    branches:
      - main
      - master
    paths:
      - pyproject.toml
      - MANIFEST.in
      - src/scribe_mcp/**
      - scripts/build_release_dists.sh
      - .github/workflows/publish-pypi.yml
  workflow_dispatch:

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-dists:
    name: Build release distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build scribe-mcp distributions
        run: ./scripts/build_release_dists.sh "${RUNNER_TEMP}/pypi-dist"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pypi-dists
          path: ${{ runner.temp }}/pypi-dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - build-dists
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pypi-dists
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist
          skip-existing: true
          print-hash: true
